<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEI Dam Academy — Dashboard</title>
<style>
  /* Existing V1.11.5 styles preserved verbatim; splash restore styling below is additive. */
  #gei-splash{position:absolute;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 42%,#102b44 0%,#05080f 46%,#010206 100%);color:#fff;isolation:isolate;opacity:1;visibility:visible;transition:opacity .65s ease,visibility .65s ease;touch-action:manipulation}
  .phone.splash-done #gei-splash{opacity:0;visibility:hidden;pointer-events:none}
  .splash-bg{position:absolute;inset:-15%;background:radial-gradient(circle at 50% 45%,rgba(47,210,255,.2),transparent 34%),radial-gradient(circle at 20% 85%,rgba(243,16,186,.16),transparent 28%),radial-gradient(circle at 82% 18%,rgba(61,61,234,.2),transparent 30%);filter:blur(6px);animation:splashPulse 4.5s ease-in-out infinite}
  .splash-rays{position:absolute;inset:-25% -60%;background:conic-gradient(from 205deg at 50% 42%,transparent 0deg,rgba(255,255,255,.06) 10deg,transparent 24deg,rgba(47,210,255,.08) 34deg,transparent 53deg,rgba(255,255,255,.05) 68deg,transparent 94deg,rgba(243,16,186,.06) 111deg,transparent 140deg,rgba(255,255,255,.045) 154deg,transparent 196deg);filter:blur(2px);animation:raysRotate 12s linear infinite;transform-origin:center}
  .splash-glow{position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(47,210,255,.32) 0%,rgba(61,61,234,.16) 36%,transparent 70%);filter:blur(12px);animation:portalBreath 3.4s ease-in-out infinite}
  .splash-core{position:absolute;width:min(76vw,310px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.12);box-shadow:0 0 0 1px rgba(47,210,255,.08),inset 0 0 45px rgba(47,210,255,.12),0 0 50px rgba(47,210,255,.12);animation:coreSpin 18s linear infinite}
  .splash-water{position:absolute;left:-10%;right:-10%;bottom:-9%;height:34%;background:linear-gradient(180deg,transparent 0%,rgba(47,210,255,.05) 24%,rgba(47,210,255,.16) 55%,rgba(61,61,234,.25) 100%);clip-path:polygon(0 32%,12% 26%,24% 35%,38% 21%,51% 33%,64% 23%,79% 35%,91% 19%,100% 28%,100% 100%,0 100%);animation:waterShift 7s ease-in-out infinite alternate}
  .splash-ripple{position:absolute;width:54%;aspect-ratio:1;border:1px solid rgba(255,255,255,.23);border-radius:50%;bottom:11%;left:23%;animation:rippleExpand 2.6s ease-out infinite}.splash-ripple.r2{animation-delay:.85s}.splash-ripple.r3{animation-delay:1.7s}
  .splash-hero{position:relative;z-index:4;width:min(58%,250px);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 18px 35px rgba(0,0,0,.55));opacity:0;transform:scale(.72);transition:opacity .35s ease}.splash-hero.is-ready{opacity:1}
  .splash-copy{position:absolute;z-index:5;top:clamp(7%,12dvh,12%);left:8%;right:8%;text-align:center;pointer-events:none}
  .splash-kicker{font-size:.6rem;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.72)}
  .splash-title{margin:.25rem 0 0;font-family:'Space Grotesk',sans-serif;font-size:clamp(2rem,10vw,3.3rem);line-height:.94;letter-spacing:-.04em;text-shadow:0 0 18px rgba(47,210,255,.35)}
  .splash-sub{margin:.55rem auto 0;max-width:320px;font-size:.72rem;line-height:1.45;color:rgba(255,255,255,.78)}
  .splash-loading{position:absolute;z-index:7;left:50%;bottom:clamp(148px,25%,180px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;font-size:.56rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.72);white-space:nowrap}.splash-loading-dot{width:7px;height:7px;border-radius:50%;background:#2fd2ff;box-shadow:0 0 12px #2fd2ff;animation:loadingPulse 1s ease-in-out infinite}
  .splash-status{position:absolute;z-index:7;left:8%;right:8%;bottom:clamp(126px,20%,154px);text-align:center;min-height:15px;font-size:.56rem;color:rgba(255,255,255,.55)}
  .splash-progress{position:absolute;z-index:6;left:10%;right:10%;bottom:clamp(88px,14%,120px);height:4px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}.splash-progress span{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#f310ba,#2fd2ff,#fff);box-shadow:0 0 10px rgba(47,210,255,.8);transition:width .3s ease}
  .splash-enter{position:absolute;z-index:7;bottom:clamp(28px,6.4%,54px);left:50%;transform:translateX(-50%);border:1px solid rgba(255,255,255,.3);background:linear-gradient(135deg,rgba(243,16,186,.95),rgba(47,210,255,.95));color:#fff;border-radius:999px;padding:11px 20px;font-weight:700;font-size:.75rem;letter-spacing:.08em;cursor:pointer;white-space:nowrap}.splash-skip{position:absolute;z-index:7;top:max(12px,env(safe-area-inset-top,12px));right:5%;border:0;background:rgba(255,255,255,.08);color:rgba(255,255,255,.78);border-radius:999px;padding:7px 10px;font-size:.58rem;font-weight:700;letter-spacing:.06em;cursor:pointer}
  @keyframes splashPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:1}}@keyframes raysRotate{to{transform:rotate(360deg)}}@keyframes portalBreath{0%,100%{transform:scale(.9);opacity:.45}50%{transform:scale(1.08);opacity:.78}}@keyframes coreSpin{to{transform:rotate(360deg)}}@keyframes waterShift{0%{transform:translateX(-2%)}100%{transform:translateX(2%)}}@keyframes rippleExpand{0%{transform:scale(.3);opacity:.65}100%{transform:scale(1.9);opacity:0}}@keyframes loadingPulse{0%,100%{transform:scale(.75);opacity:.45}50%{transform:scale(1.2);opacity:1}}
  @media(max-height:700px){.splash-copy{top:6%}.splash-hero{width:min(54%,220px)}.splash-loading{bottom:15%}.splash-status{bottom:12.5%}.splash-progress{bottom:10%}.splash-enter{bottom:4.5%}.splash-water{height:30%}}@media(max-width:350px){.splash-title{font-size:clamp(1.8rem,11vw,2.4rem)}.splash-sub{font-size:.67rem}.splash-enter{font-size:.68rem;padding:10px 16px}}@media(prefers-reduced-motion:reduce){.splash-bg,.splash-rays,.splash-glow,.splash-core,.splash-water,.splash-ripple,.splash-loading-dot{animation:none!important}}
</style>
</head>
<body data-theme="regular">

</div></div>

<script>/* V1.10 — Stable Member Since + Dashboard Adam */(function(){'use strict';var KEY='gei_member_since_v1';function pad(n){return String(n).padStart(2,'0')}function formatDate(iso){var d=new Date(iso);if(Number.isNaN(d.getTime()))return null;try{return new Intl.DateTimeFormat(undefined,{year:'numeric',month:'short',day:'numeric'}).format(d)}catch(e){return(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()))}}function firstVisit(){var stored='';try{stored=localStorage.getItem(KEY)||''}catch(e){}if(stored){var existing=formatDate(stored);if(existing)return stored;try{localStorage.removeItem(KEY)}catch(e){}}var now=new Date().toISOString();try{localStorage.setItem(KEY,now)}catch(e){}return now}function render(){var dateEl=document.getElementById('memberSinceDate');var proofEl=document.getElementById('memberSinceProof');if(!dateEl)return;var value=firstVisit();var label=formatDate(value);if(label){dateEl.textContent=label;if(proofEl)proofEl.textContent='First visit recorded'}else{dateEl.textContent='First visit recorded';if(proofEl)proofEl.textContent='Local member record'}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',render,{once:true});else render()})();</script>
</body>
