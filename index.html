<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GEI Dam Academy</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06070d;color:#fff;font-family:system-ui,sans-serif}.phone{position:relative;width:min(430px,100vw);height:100dvh;margin:auto;overflow:hidden}.splash{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#123a59,#04070d 58%,#010205);z-index:9;transition:opacity .6s ease,visibility .6s ease}.splash.done{opacity:0;visibility:hidden;pointer-events:none}.copy{position:absolute;top:10%;left:8%;right:8%;text-align:center}.k{font-size:.62rem;letter-spacing:.22em;font-weight:800;opacity:.72}.t{font-size:clamp(2.2rem,11vw,3.3rem);line-height:.92;font-weight:800;margin:.25rem 0}.s{font-size:.74rem;line-height:1.45;opacity:.78}.hero{width:min(58%,250px);max-width:100%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 18px 35px rgba(0,0,0,.55));animation:heroIn .9s ease forwards}.enter{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);border:1px solid #ffffff55;background:linear-gradient(135deg,#f310ba,#2fd2ff);color:#fff;border-radius:999px;padding:11px 20px;font-weight:800;letter-spacing:.06em;white-space:nowrap}.skip{position:absolute;right:5%;top:max(12px,env(safe-area-inset-top,12px));border:0;background:#ffffff14;color:#fff;border-radius:999px;padding:7px 10px;font-weight:700}.progress{position:absolute;left:10%;right:10%;bottom:17%;height:4px;background:#ffffff1a;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#f310ba,#2fd2ff,#fff);animation:fill var(--dur,4.5s) linear forwards}.pulse{position:absolute;inset:18%;border-radius:50%;box-shadow:0 0 0 1px #2fd2ff22,0 0 70px #2fd2ff33,inset 0 0 45px #2fd2ff18;animation:pulse 3.5s ease-in-out infinite}.water{position:absolute;left:-10%;right:-10%;bottom:-5%;height:32%;background:linear-gradient(180deg,transparent,#2fd2ff26 55%,#3d3dea55);clip-path:polygon(0 35%,12% 25%,26% 36%,40% 22%,55% 35%,70% 24%,84% 34%,100% 20%,100% 100%,0 100%)}@keyframes fill{to{width:100%}}@keyframes pulse{0%,100%{transform:scale(.9);opacity:.45}50%{transform:scale(1.08);opacity:.82}}@keyframes heroIn{from{opacity:0;transform:scale(.72) translateY(24px)}70%{opacity:1;transform:scale(1.03) translateY(-2px)}to{opacity:1;transform:scale(1) translateY(0)}}@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}</style></head><body><main class="phone" id="app"><section class="splash" id="splash" aria-label="Genesis Engineered cinematic splash"><div class="pulse"></div><div class="water"></div><img class="hero" id="hero" alt="YallToo mascot introducing the GEI Dam Academy"><div class="copy"><div class="k" id="kicker">YALLTOO PRESENTS</div><div class="t">GENESIS<br>ENGINEERED</div><div class="s">A cinematic gateway into the Dam Academy — observe, question, discover, create knowledge.</div></div><div class="progress"><span></span></div><button class="enter" id="enter">ENTER THE BLUEPRINT</button><button class="skip" id="skip">SKIP</button></section><section style="position:absolute;inset:0;background:#fff"></section></main><script>(()=>{const KEY='gei_splash_state_v2';const ASSETS=['https://assets.zyrosite.com/YZ9jg46Bljs5wOZR/yalltoo-mascot-animated-UgmkGIe3sJES4tKm.gif','https://assets.zyrosite.com/YZ9jg46Bljs5wOZR/yall-too-logo-vq2GKHxbTzr7g8bO.png'];const FX=['float','drift','orbit','pendulum','breathe','sway','rise','glide','pulse','tilt','figure8','bob','zoom','wave','levitate','helix','shimmer','lunge','rock','aurora','tide','spiral','hover','elastic'];const now=Date.now();let st={visits:0,lastShown:0,lastAsset:'',lastEffect:'',seen:false};try{st={...st,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}const delta=now-(st.lastShown||0);const mode=!st.seen?'first':delta<90000?'quick':delta<1800000?'returning':'reentry';st.visits++;st.lastShown=now;st.seen=true;function pick(a,last){let p=a.filter(x=>x!==last);if(!p.length)p=a.slice();return p[Math.floor(Math.random()*p.length)]}const asset=pick(ASSETS,st.lastAsset);const effect=pick(FX,st.lastEffect);st.lastAsset=asset;st.lastEffect=effect;localStorage.setItem(KEY,JSON.stringify(st));const splash=document.getElementById('splash');const hero=document.getElementById('hero');const kicker=document.getElementById('kicker');hero.src=asset;hero.onerror=()=>{hero.src=ASSETS[0]};splash.classList.add(mode);if(mode==='returning')kicker.textContent='WELCOME BACK, OPERATOR';if(mode==='reentry')kicker.textContent='RE-ENTRY';if(mode==='quick'){kicker.textContent='FAST RE-ENTRY';document.querySelector('.enter').style.display='none';document.querySelector('.skip').style.display='none'}const animations={float:'heroFloat',drift:'heroDrift',orbit:'heroOrbit',pendulum:'heroPendulum',breathe:'heroBreathe',sway:'heroSway',rise:'heroRise',glide:'heroGlide',pulse:'heroPulse',tilt:'heroTilt',figure8:'heroFigure8',bob:'heroBob',zoom:'heroZoom',wave:'heroWave',levitate:'heroLevitate',helix:'heroHelix',shimmer:'heroShimmer',lunge:'heroLunge',rock:'heroRock',aurora:'heroAurora',tide:'heroTide',spiral:'heroSpiral',hover:'heroHover',elastic:'heroElastic'};const defs={heroFloat:'@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}',heroDrift:'@keyframes heroDrift{0%,100%{transform:translate(0)}50%{transform:translate(8px,-5px)}}',heroOrbit:'@keyframes heroOrbit{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}',heroPendulum:'@keyframes heroPendulum{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}',heroBreathe:'@keyframes heroBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}',heroSway:'@keyframes heroSway{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}',heroRise:'@keyframes heroRise{0%,100%{transform:translateY(3px)}50%{transform:translateY(-10px)}}',heroGlide:'@keyframes heroGlide{0%,100%{transform:translateX(-7px)}50%{transform:translateX(7px)}}',heroPulse:'@keyframes heroPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}',heroTilt:'@keyframes heroTilt{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}',heroFigure8:'@keyframes heroFigure8{0%,100%{transform:translate(0)}25%{transform:translate(7px,-5px)}75%{transform:translate(-7px,5px)}}',heroBob:'@keyframes heroBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px) rotate(-2deg)}}',heroZoom:'@keyframes heroZoom{0%,100%{transform:scale(.98)}50%{transform:scale(1.07)}}',heroWave:'@keyframes heroWave{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}',heroLevitate:'@keyframes heroLevitate{0%,100%{transform:translateY(2px)}50%{transform:translateY(-11px)}}',heroHelix:'@keyframes heroHelix{0%,100%{transform:rotate(0)}50%{transform:rotate(180deg)}}',heroShimmer:'@keyframes heroShimmer{0%,100%{filter:drop-shadow(0 18px 35px rgba(0,0,0,.55))}50%{filter:drop-shadow(0 18px 35px rgba(47,210,255,.4))}}',heroLunge:'@keyframes heroLunge{0%,100%{transform:translateY(3px) scale(1)}50%{transform:translateY(-6px) scale(1.05)}}',heroRock:'@keyframes heroRock{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}',heroAurora:'@keyframes heroAurora{0%,100%{transform:translate(0)}50%{transform:translate(6px,-6px) rotate(2deg)}}',heroTide:'@keyframes heroTide{0%,100%{transform:translate(-4px,2px)}50%{transform:translate(4px,-4px)}}',heroSpiral:'@keyframes heroSpiral{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.04)}}',heroHover:'@keyframes heroHover{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px) rotate(3deg)}}',heroElastic:'@keyframes heroElastic{0%,100%{transform:scale(1)}30%{transform:scale(1.06,.96)}60%{transform:scale(.98,1.03)}}'};const tag=document.createElement('style');tag.textContent=Object.values(defs).join('');document.head.appendChild(tag);hero.style.animation=`heroIn .9s .05s cubic-bezier(.18,.86,.32,1.28) forwards,${animations[effect]||'heroFloat'} 3.6s ease-in-out infinite`;const delay=mode==='first'?4600:mode==='reentry'?3000:mode==='returning'?2400:650;let timer=setTimeout(done,delay);function done(){clearTimeout(timer);splash.classList.add('done');setTimeout(()=>splash.remove(),650)}document.getElementById('enter').onclick=done;document.getElementById('skip').onclick=done;window.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '||e.key==='Escape')done()});})();</script></body></html>
