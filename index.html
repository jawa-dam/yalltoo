  :root{--cyan:#2fd2ff;--indigo:#3d3dea;--magenta:#f310ba;--pink:#ff9df2;--ink:#06070d;--paper:#fff;--surface:#fff;--mist:#f4f6fb;--line:#e6e8f0;--grey:#7a7f92;--cart-a:#ff4bd8;--cart-b:#2fd2ff;}
  body[data-theme="dark"]{--surface:#15161f;--ink:#f2f4fb;--mist:#1c1d29;--line:#2c2d3a;--grey:#9aa0b8;--cart-a:#b27cff;--cart-b:#2fd2ff;}
  body[data-theme="hotpink"]{--cyan:#ff73d8;--indigo:#b91886;--magenta:#ff1f9c;--pink:#ffc0ef;--surface:#fff4fb;--line:#ffd1eb;--grey:#a75d89;--cart-a:#ff1493;--cart-b:#ff67d7;}
  body[data-theme="babyblue"]{--cyan:#83ddff;--indigo:#3f8fd0;--magenta:#62b9ef;--pink:#d8f4ff;--surface:#f0fbff;--line:#cbeafb;--grey:#7593a8;--cart-a:#2aaaf2;--cart-b:#9feaff;}
  *{box-sizing:border-box;}html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--surface);font-family:'Inter',system-ui,sans-serif;color:var(--ink);transition:background-color .65s ease,color .65s ease}.stage{position:fixed;inset:0;width:100%;height:100%;display:flex;align-items:stretch;justify-content:center;overflow:hidden}.phone{position:relative;width:min(430px,100vw);height:100dvh;min-height:100%;max-height:100dvh;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;isolation:isolate;transition:background-color .65s ease;contain:layout paint size}.screen{position:absolute;inset:0;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface);transform:translate3d(0,0,0);transition:transform .32s ease,opacity .32s ease,background-color .65s ease}.screen.off-right{transform:translate3d(100%,0,0);pointer-events:none}.screen.off-left{transform:translate3d(-30%,0);opacity:0;pointer-events:none}
  /* V1.12.5 — deterministic startup paint: splash owns the phone before JS initializes. */
  #app-phone>.screen{visibility:hidden!important;opacity:0!important;pointer-events:none!important}
  #app-phone>#gei-splash{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;display:flex!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;z-index:2147483647!important;background:#06070d!important;background-color:#06070d!important;isolation:isolate!important;overflow:hidden!important}
  #app-phone.splash-done>.screen{visibility:visible!important;opacity:1!important;pointer-events:auto!important}
  #app-phone.splash-done>#gei-splash{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}
  #app-phone>#gei-splash>.splash-bg{z-index:1!important;opacity:1!important}
  #app-phone>#gei-splash>.splash-rays,#app-phone>#gei-splash>.splash-glow,#app-phone>#gei-splash>.splash-core,#app-phone>#gei-splash>.splash-water,#app-phone>#gei-splash>.splash-ripple,#app-phone>#gei-splash>.splash-copy{z-index:2!important}
  #app-phone>#gei-splash>.splash-hero{z-index:3!important}
</style>
