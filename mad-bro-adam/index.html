const surprise = $("surprise");

const speak = (text) => {
  if (!("speechSynthesis" in window)) { surprise.textContent = "Your browser does not support voice playback. The DAM Master is silently disappointed."; return; }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 0.86; utterance.pitch = 0.62; utterance.volume = 1;
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => /en-US/i.test(v.lang) && /male|david|mark|daniel/i.test(v.name)) || voices.find(v => /en-US/i.test(v.lang));
  if (preferred) utterance.voice = preferred;
  window.speechSynthesis.speak(utterance);
};

/* ── SCREENSAVER ── */
(() => {
const IDLE_MS = 3000;
const SHOW_MS = 4000;
const FADE_OUT_MS = 600;

const images = [
  {src:"https://assets.zyrosite.com/YZ9jg46Bljs5wOZR/wilbert-the-dam-guide-Jv8ovjc6i8PutsiP.png",name:"WILBERT THE DAM GUIDE"},
  {src:"https://assets.zyrosite.com/YZ9jg46Bljs5wOZR/yall-too-beaver-rhhiVplt1GMykxV8.png",name:"Y'ALL TOO BEAVER"},
  {src:"https://assets.zyrosite.com/YZ9jg46Bljs5wOZR/operator-fireman-3hTPsSNuSI8dOo3K.png",name:"OPERATOR FIREMAN"},
  {src:"https://assets.zyrosite.com/YZ9jg46Bljs5wOZR/operator-moses-NaoYxXNs8PIe8VAq.png",name:"OPERATOR MOSES"},
  {src:"https://assets.zyrosite.com/YZ9jg46Bljs5wOZR/operator-valentine-qL9S3qnHVqfuQlf7.png",name:"OPERATOR VALENTINE"},
  {src:"https://assets.zyrosite.com/YZ9jg46Bljs5wOZR/operator-sam-JpZqlSoHFxPr8UA8.png",name:"OPERATOR SAM"},
  {src:"https://assets.zyrosite.com/YZ9jg46Bljs5wOZR/operator-jack-o-lantern-ttAhh3czPzwGoHfW.png",name:"OPERATOR JACK-O-LANTERN"},
  {src:"https://assets.zyrosite.com/YZ9jg46Bljs5wOZR/operator-santa-claus-eyMjBlQqWCVDRsc2.png",name:"OPERATOR SANTA CLAUS"},
  {src:"https://assets.zyrosite.com/YZ9jg46Bljs5wOZR/operator-woman-SBXOdIurIocbRsrx.png",name:"OPERATOR WOMAN"},
  {src:"https://assets.zyrosite.com/YZ9jg46Bljs5wOZR/operator-man-iOjCPh1RTtpl4t40.png",name:"OPERATOR MAN"}
];

const effects = [
  {name:"ss-fade-in",dur:".8s",ease:"ease"},
  {name:"ss-slide-left",dur:"1s",ease:"cubic-bezier(.2,.8,.3,1)"},
  {name:"ss-slide-right",dur:"1s",ease:"cubic-bezier(.2,.8,.3,1)"},
  {name:"ss-slide-up",dur:"1s",ease:"cubic-bezier(.2,.8,.3,1)"},
  {name:"ss-slide-down",dur:"1s",ease:"cubic-bezier(.2,.8,.3,1)"},
  {name:"ss-zoom-spin",dur:"1s",ease:"cubic-bezier(.2,.8,.3,1)"},
  {name:"ss-flip",dur:".9s",ease:"ease"},
  {name:"ss-bounce",dur:"1s",ease:"ease"},
  {name:"ss-glitch",dur:".7s",ease:"steps(6)"},
  {name:"ss-drop",dur:"1.2s",ease:"cubic-bezier(.2,.8,.3,1)"}
];

const titles = ["DAM CREW ON STANDBY","THE DAM SQUAD","HEADQUARTERS PERSONNEL","WHO'S WATCHING THE DAM?","CLASSIFIED OPERATIVES","DAM TEAM ASSEMBLE","MEET THE CREW","AGENTS OF THE DAM"];

const overlay = document.createElement("div");
overlay.className = "ss-overlay";
overlay.innerHTML = '<div class="scanlines" aria-hidden="true"></div><div class="ss-title"></div><div class="ss-label"></div>';
document.body.appendChild(overlay);

const ssTitle = overlay.querySelector(".ss-title");
const ssLabel = overlay.querySelector(".ss-label");
let currentImg = null;
let idleTimer = null;
let cycleTimer = null;
let active = false;
let lastIdx = -1;

images.forEach(i => { const p = new Image(); p.src = i.src; });

const R = a => a[Math.floor(Math.random()*a.length)];

function pickImage() {
  let idx;
  do { idx = Math.floor(Math.random()*images.length); } while(idx === lastIdx && images.length > 1);
  lastIdx = idx;
  return images[idx];
}

function showImage() {
  if (!active) return;
  if (currentImg) {
    currentImg.style.animation = `ss-fade-out ${FADE_OUT_MS}ms ease forwards`;
    const old = currentImg;
    setTimeout(() => old.remove(), FADE_OUT_MS);
  }

  const pick = pickImage();
  const fx = R(effects);
  const img = document.createElement("img");
  img.className = "ss-img";
  img.src = pick.src;
  img.alt = pick.name;
  img.style.animation = `${fx.name} ${fx.dur} ${fx.ease} forwards`;
  overlay.appendChild(img);
  currentImg = img;
  ssLabel.textContent = pick.name;

  cycleTimer = setTimeout(showImage, SHOW_MS);
}

function startScreensaver() {
  if (active) return;
  active = true;
  ssTitle.textContent = R(titles);
  overlay.classList.add("active");
  showImage();
}

function stopScreensaver() {
  if (!active) return;
  active = false;
  overlay.classList.remove("active");
  clearTimeout(cycleTimer);
  if (currentImg) { currentImg.remove(); currentImg = null; }
  lastIdx = -1;
  resetIdle();
}

function resetIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(startScreensaver, IDLE_MS);
}

["mousemove","mousedown","keydown","touchstart","scroll","click"].forEach(e =>
  document.addEventListener(e, () => { if (active) stopScreensaver(); else resetIdle(); }, {passive:true})
);

resetIdle();
})();
</script>
