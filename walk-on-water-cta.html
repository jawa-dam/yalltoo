  if (FX.mist) for (i = 0; i < 3; i++) mist.push({ x: R(0, W), y: BASE - R(2, 10), r: R(38, 60), sp: R(.15, .35) });

  var RATES = { sparkle: [.55, 1.2], crystal: [.6, 1.3], bubbles: [.3, .75], stars: [.28, .6], floaters: [.3, .7], energy: [.7, 1.6], rings: [1.0, 2.0] };
  var effT = {};
  for (var key in RATES) if (FX[key]) effT[key] = R(.1, .8);

  var introAt = R(.25, .6), introDone = false, introFx = null;

  /* ================= WATER ================= */
  function openX(uu) { return OPEN_ARRIVE + gs * LOOP * (U_ARRIVE - uu); }
  function swellEnv(uu) {
    var a = 0.46, b = 0.76;
    if (uu < a || uu > b) return 0;
    var s = Math.sin(Math.PI * (uu - a) / (b - a));
    return s * s;
  }
  function surf(x) {
    var y = BASE
      + cfg.a1 * Math.sin(x * 0.037 - t * 1.9 * cfg.waveSpd + cfg.p1)
      + cfg.a2 * Math.sin(x * 0.098 - t * 3.1 * cfg.waveSpd + cfg.p2);
    var e = swellEnv(u);
    if (e > 0) { var d = (x - (CX + 4)) / 34; y -= e * cfg.swell * Math.exp(-d * d); }
    return y;
  }
  function backSurf(x) {
    return BASE - 9 + cfg.aBack * Math.sin(x * 0.028 - t * 1.3 * cfg.waveSpd + cfg.p2 + 1.7)
                    + 1.2 * Math.sin(x * 0.075 - t * 2.2 * cfg.waveSpd);
  }
  function frontSurf(x) {
    return BASE + 17 + 2.2 * Math.sin(x * 0.045 - t * 2.4 * cfg.waveSpd + cfg.p1 + 2.2);
  }

  function wavePath(fn, bottom) {
    ctx.beginPath();
    ctx.moveTo(-12, bottom);
    for (var x = -12; x <= W + 12; x += 6) ctx.lineTo(x, fn(x));
    ctx.lineTo(W + 12, bottom);
    ctx.closePath();
  }
  function crestPath(x0, x1, off) {
    ctx.beginPath();
    for (var x = x0; x <= x1; x += 5) { var y = surf(x) + off; x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  }

  function drawWater() {
    wavePath(backSurf, H);
    var g0 = ctx.createLinearGradient(0, BASE - 14, 0, H);
    g0.addColorStop(0, rgba(WAT.back[0], .55));
    g0.addColorStop(.55, rgba(WAT.back[1], .25));
    g0.addColorStop(1, rgba(WAT.back[2], 0));
    ctx.fillStyle = g0; ctx.fill();

    wavePath(surf, H);
    var g1 = ctx.createLinearGradient(0, BASE - 12, 0, H);
    g1.addColorStop(0, rgba(WAT.surf[0], .95));
    g1.addColorStop(WAT.stops[0], rgba(WAT.surf[1], .92));
    g1.addColorStop(WAT.stops[1], rgba(WAT.surf[2], .45));
    g1.addColorStop(WAT.stops[2], rgba(WAT.surf[3], .12));
    g1.addColorStop(1, rgba(WAT.surf[3], 0));
    ctx.fillStyle = g1; ctx.fill();

    drawOpening();

    crestPath(-12, W + 12, 0);
    ctx.strokeStyle = rgba(WAT.foam, .9); ctx.lineWidth = 1.8; ctx.stroke();

    if (FX.rainbow) {
      var rg = ctx.createLinearGradient(0, 0, W, 0);
      for (var s = 0; s <= 6; s++) rg.addColorStop(s / 6, "hsla(" + ((s * 55 + t * 45) % 360) + ",95%,74%,.62)");
      crestPath(-12, W + 12, 0.6); ctx.strokeStyle = rg; ctx.lineWidth = 2.1; ctx.stroke();
      ctx.globalAlpha = .45; crestPath(-12, W + 12, 4); ctx.lineWidth = 1.2; ctx.stroke(); ctx.globalAlpha = 1;
    }

    ctx.lineCap = "round";
    for (var i = 0; i < flecks.length; i++) {
      var f = flecks[i], fy = surf(f.x) + 4.5;
      ctx.beginPath(); ctx.moveTo(f.x, fy); ctx.lineTo(f.x + f.len, surf(f.x + f.len) + 4.5);
      ctx.strokeStyle = rgba(WAT.foam, f.a * .55); ctx.lineWidth = 1.2; ctx.stroke();
    }
  }

  function openAlpha(uu) {
    if (uu < cfg.openFade) return uu / cfg.openFade;
    if (uu < U_BURST) return 1;
    if (uu < 0.7) return 1 - (uu - U_BURST) / 0.1;
    return 0;
  }

  function drawOpening() {
    var a = openAlpha(u) * cfg.glow;
    if (a <= 0.01) return;
    var x = openX(u), y = surf(x) + 3;
    var p = OPEN;
    var flare = 1 + 0.9 * Math.max(0, 1 - Math.abs(u - U_BURST) / 0.06);
    var pulse = 1 + 0.08 * Math.sin(t * 4.2);
    var rx = 20 * pulse * flare, ry = 6.5 * pulse * (0.8 + 0.2 * flare);

    ctx.save();
    var sh = ctx.createLinearGradient(0, y - 46, 0, y);
    sh.addColorStop(0, rgba(p.mid, 0));
    sh.addColorStop(1, rgba(p.mid, 0.22 * a * flare));
    ctx.fillStyle = sh;
    ctx.beginPath();
    ctx.moveTo(x - rx * .7, y); ctx.lineTo(x - rx * .25, y - 46);
    ctx.lineTo(x + rx * .25, y - 46); ctx.lineTo(x + rx * .7, y);
    ctx.closePath(); ctx.fill();

    ctx.translate(x, y); ctx.scale(1, ry / rx);
    var g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx * 1.9);
    g.addColorStop(0, rgba(p.core, 0.95 * a));
    g.addColorStop(.22, rgba(p.mid, 0.85 * a));
    g.addColorStop(.55, rgba(p.edge, 0.35 * a));
    g.addColorStop(.8, rgba(p.tint, 0.10 * a));
    g.addColorStop(1, rgba(p.edge, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, rx * 1.9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, rx * .62, 0, Math.PI * 2);
    ctx.strokeStyle = rgba("255,255,255", 0.75 * a); ctx.lineWidth = 1.4 * rx / ry * .45; ctx.stroke();
    ctx.restore();
  }

  function drawFront() {
    wavePath(frontSurf, H);
    var g = ctx.createLinearGradient(0, BASE + 12, 0, H);
    g.addColorStop(0, rgba(WAT.front[0], .35));
    g.addColorStop(.5, rgba(WAT.front[1], .18));
    g.addColorStop(1, rgba(WAT.front[1], 0));
    ctx.fillStyle = g; ctx.fill();
    ctx.beginPath();
    for (var x = -12; x <= W + 12; x += 6) { var y = frontSurf(x); x === -12 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.strokeStyle = rgba(WAT.foam, .35); ctx.lineWidth = 1; ctx.stroke();
  }

  function drawRays() {
    if (!FX.rays) return;
    var sx = cfg.rayX, sy = -40;
    var g = ctx.createLinearGradient(0, sy, 0, BASE + 14);
    g.addColorStop(0, rgba(FXC.light, 0));
    g.addColorStop(.55, rgba(FXC.light, 1));
    g.addColorStop(1, rgba(FXC.light, 0));
    ctx.save(); ctx.fillStyle = g;
    for (var i = 0; i < 5; i++) {
      var ang = -0.52 + i * 0.26 + 0.04 * Math.sin(t * .5 + i * 1.3);
      var len = 200, half = 0.05 + 0.015 * (i % 2);
      ctx.globalAlpha = clamp((0.08 + 0.05 * Math.sin(t * .8 + i * 1.7)) * cfg.glow, 0, .2);
      ctx.beginPath(); ctx.moveTo(sx, sy);
      ctx.lineTo(sx + Math.sin(ang - half) * len, sy + Math.cos(ang - half) * len);
      ctx.lineTo(sx + Math.sin(ang + half) * len, sy + Math.cos(ang + half) * len);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawMist() {
    if (!FX.mist) return;
    for (var i = 0; i < mist.length; i++) {
      var m = mist[i];
      ctx.save(); ctx.translate(m.x, m.y); ctx.scale(1, .3);
      var g = ctx.createRadialGradient(0, 0, 0, 0, 0, m.r);
      var a = 0.2 + 0.06 * Math.sin(t * .7 + i * 2);
      g.addColorStop(0, rgba(FXC.light, a)); g.addColorStop(1, rgba(FXC.light, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, m.r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  /* ================= CHARACTER ================= */
  var L1 = 17, L2 = 17, HIP_H = 31, TORSO = 25, UA = 12.5, FA = 11.5;

  function easeIO(q) { return q < .5 ? 2 * q * q : 1 - Math.pow(-2 * q + 2, 2) / 2; }

  function legState(i) {
    var p = (phi + i * 0.5) % 1;
    var fx, fy, lift = 0;
    if (p < STANCE) {
      fx = CX + cfg.stride / 2 - cfg.stride * (p / STANCE);
      fy = surf(fx);
    } else {
      var q = (p - STANCE) / (1 - STANCE);
      fx = CX - cfg.stride / 2 + cfg.stride * easeIO(q);
      lift = 7 * Math.sin(Math.PI * q);
      fy = surf(fx) - lift;
    }
    return { p: p, x: fx, y: fy, lift: lift, fwd: (fx - CX) / (cfg.stride / 2) };
  }

  function ik(hx, hy, fx, fy) {
    var dx = fx - hx, dy = fy - hy;
    var d = Math.sqrt(dx * dx + dy * dy);
    var max = L1 + L2 - 0.2;
    if (d > max) { fx = hx + dx / d * max; fy = hy + dy / d * max; dx = fx - hx; dy = fy - hy; d = max; }
    var a = Math.atan2(dy, dx);
    var c = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
    var off = Math.acos(Math.max(-1, Math.min(1, c)));
    var ka = a - off;
    return { kx: hx + Math.cos(ka) * L1, ky: hy + Math.sin(ka) * L1, fx: fx, fy: fy };
  }

  function limb(ax, ay, bx, by, cx2, cy2, w, col) {
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx2, cy2);
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.stroke();
  }

  function drawLeg(hx, hy, L, back) {
    var k = ik(hx, hy, L.x, L.y);
    limb(hx, hy, k.kx, k.ky, k.fx, k.fy, 5.6, back ? ATT.legs[0] : ATT.legs[1]);
    var tilt = L.p < STANCE ? 0 : -0.35 * Math.sin(Math.PI * (L.p - STANCE) / (1 - STANCE));
    ctx.save(); ctx.translate(k.fx, k.fy); ctx.rotate(tilt);
    ctx.beginPath();
    ctx.moveTo(-2.4, -2.2); ctx.lineTo(5.2, -1.6); ctx.quadraticCurveTo(7, 0.6, 4.6, 1.4); ctx.lineTo(-2.6, 1.4);
    ctx.quadraticCurveTo(-3.6, 0, -2.4, -2.2); ctx.closePath();
    ctx.fillStyle = back ? "#b9e9f7" : "#f4fdff"; ctx.fill();
    ctx.fillStyle = rgba(ATT.shoe, .9); ctx.fillRect(-2.6, 0.6, 8, 0.9);
    ctx.restore();
  }

  function drawArm(sx, sy, swing, back) {
    var a1 = Math.PI / 2 + swing;
    var ex = sx + Math.cos(a1) * UA, ey = sy + Math.sin(a1) * UA;
    var a2 = a1 - (0.35 + 0.45 * Math.max(0, -swing));
    var hx = ex + Math.cos(a2) * FA, hy = ey + Math.sin(a2) * FA;
    limb(sx, sy, ex, ey, hx, hy, 4.4, back ? CHAR.skinDark : CHAR.skinMid);
    ctx.beginPath(); ctx.arc(hx, hy, 2.4, 0, Math.PI * 2);
    ctx.fillStyle = back ? CHAR.skinDark : CHAR.skinBase; ctx.fill();
  }

  function drawStaff(sx, sy, swing) {
    if (!CHAR.staff) return;
    var a1 = Math.PI / 2 + swing;
    var ex = sx + Math.cos(a1) * UA, ey = sy + Math.sin(a1) * UA;
    var a2 = a1 - (0.35 + 0.45 * Math.max(0, -swing));
    var hx = ex + Math.cos(a2) * FA, hy = ey + Math.sin(a2) * FA;
    var staffLen = 52;
    var staffAng = Math.PI / 2 + swing * 0.3 + 0.08;
    var tx = hx + Math.cos(staffAng) * staffLen;
    var ty = hy + Math.sin(staffAng) * staffLen;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx, ty);
    ctx.strokeStyle = "#5a3a1e"; ctx.lineWidth = 2.8; ctx.lineCap = "round"; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx, ty);
    ctx.strokeStyle = "#8a6430"; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.beginPath(); ctx.arc(hx, hy - 1, 3.2, 0, Math.PI * 2);
    ctx.fillStyle = "#6a4a24"; ctx.fill();
  }

  function drawHair(hdx, hdy) {
    var hc = CHAR.hairColor;
    switch (CHAR.hairStyle) {
      case "long":
        ctx.beginPath();
        ctx.arc(hdx - 0.8, hdy - 1.2, 9.6, Math.PI * 0.92, Math.PI * 1.98);
        ctx.quadraticCurveTo(hdx + 3, hdy - 5, hdx - 2, hdy - 3.5);
        ctx.quadraticCurveTo(hdx - 6, hdy - 1, hdx - 9.4, hdy + 1.5);
        ctx.closePath(); ctx.fillStyle = hc; ctx.fill();
        ctx.beginPath();
        ctx.moveTo(hdx - 8, hdy + 3);
        ctx.quadraticCurveTo(hdx - 10, hdy + 14, hdx - 6, hdy + 20);
        ctx.quadraticCurveTo(hdx - 8, hdy + 14, hdx - 5, hdy + 4);
        ctx.fillStyle = hc; ctx.fill();
        break;
      case "short":
        ctx.beginPath();
        ctx.arc(hdx, hdy - 1, 10, Math.PI * 0.85, Math.PI * 1.95);
        ctx.quadraticCurveTo(hdx + 4, hdy - 6, hdx + 2, hdy - 2);
        ctx.closePath(); ctx.fillStyle = hc; ctx.fill();
        break;
      case "curly":
        ctx.beginPath();
        ctx.arc(hdx - 0.5, hdy - 1, 10.5, Math.PI * 0.8, Math.PI * 2);
        ctx.closePath(); ctx.fillStyle = hc; ctx.fill();
        for (var ci = 0; ci < 6; ci++) {
          var ca = Math.PI * 0.8 + ci * 0.22;
          var crx = hdx - 0.5 + Math.cos(ca) * 10.8, cry = hdy - 1 + Math.sin(ca) * 10.8;
          ctx.beginPath(); ctx.arc(crx, cry, 2.2, 0, Math.PI * 2);
          ctx.fillStyle = hc; ctx.fill();
        }
        break;
      case "bald":
        ctx.beginPath();
        ctx.arc(hdx, hdy - 1, 9.8, Math.PI * 1.1, Math.PI * 1.9);
        ctx.closePath(); ctx.fillStyle = hc; ctx.fill();
        break;
      case "medium":
        ctx.beginPath();
        ctx.arc(hdx - 0.8, hdy - 1.2, 9.6, Math.PI * 0.92, Math.PI * 1.98);
        ctx.quadraticCurveTo(hdx + 3, hdy - 5, hdx - 2, hdy - 3.5);
        ctx.quadraticCurveTo(hdx - 6, hdy - 1, hdx - 9.4, hdy + 1.5);
        ctx.closePath(); ctx.fillStyle = hc; ctx.fill();
        break;
      case "tied":
        ctx.beginPath();
        ctx.arc(hdx - 0.5, hdy - 1, 10, Math.PI * 0.85, Math.PI * 2);
        ctx.closePath(); ctx.fillStyle = hc; ctx.fill();
        ctx.beginPath();
        ctx.moveTo(hdx - 8, hdy + 2);
        ctx.quadraticCurveTo(hdx - 12, hdy + 8, hdx - 8, hdy + 12);
        ctx.quadraticCurveTo(hdx - 6, hdy + 10, hdx - 7, hdy + 3);
        ctx.fillStyle = hc; ctx.fill();
        ctx.beginPath(); ctx.arc(hdx - 8, hdy + 4, 2, 0, Math.PI * 2);
        ctx.fillStyle = ATT.sash; ctx.fill();
        break;
      default:
        ctx.beginPath();
        ctx.arc(hdx - 0.8, hdy - 1.2, 9.6, Math.PI * 0.92, Math.PI * 1.98);
        ctx.quadraticCurveTo(hdx + 3, hdy - 5, hdx - 2, hdy - 3.5);
        ctx.quadraticCurveTo(hdx - 6, hdy - 1, hdx - 9.4, hdy + 1.5);
        ctx.closePath(); ctx.fillStyle = hc; ctx.fill();
    }
  }

  function drawBeard(hdx, hdy) {
    if (CHAR.beard === "none") return;
    var bc = CHAR.beardColor;
    switch (CHAR.beard) {
      case "full":
        ctx.beginPath();
        ctx.moveTo(hdx + 2, hdy + 4);
        ctx.quadraticCurveTo(hdx + 6, hdy + 6, hdx + 5, hdy + 12);
        ctx.quadraticCurveTo(hdx + 3, hdy + 15, hdx + 1, hdy + 14);
        ctx.quadraticCurveTo(hdx - 1, hdy + 12, hdx + 0, hdy + 6);
        ctx.closePath();
        ctx.fillStyle = bc; ctx.fill();
        break;
      case "long":
        ctx.beginPath();
        ctx.moveTo(hdx + 1, hdy + 4);
        ctx.quadraticCurveTo(hdx + 7, hdy + 7, hdx + 6, hdy + 16);
        ctx.quadraticCurveTo(hdx + 3, hdy + 22, hdx + 0, hdy + 20);
        ctx.quadraticCurveTo(hdx - 2, hdy + 16, hdx - 1, hdy + 6);
        ctx.closePath();
        ctx.fillStyle = bc; ctx.fill();
        break;
      case "stubble":
        ctx.save();
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.moveTo(hdx + 2, hdy + 3.5);
        ctx.quadraticCurveTo(hdx + 5, hdy + 5, hdx + 4.5, hdy + 8);
        ctx.quadraticCurveTo(hdx + 2, hdy + 9, hdx + 0.5, hdy + 5);
        ctx.closePath();
        ctx.fillStyle = bc; ctx.fill();
        ctx.restore();
        break;
      case "short":
        ctx.beginPath();
        ctx.moveTo(hdx + 2, hdy + 4);
        ctx.quadraticCurveTo(hdx + 5.5, hdy + 5.5, hdx + 5, hdy + 9);
        ctx.quadraticCurveTo(hdx + 3, hdy + 11, hdx + 1, hdy + 10);
        ctx.quadraticCurveTo(hdx - 0.5, hdy + 8, hdx + 0, hdy + 5.5);
        ctx.closePath();
        ctx.fillStyle = bc; ctx.fill();
        break;
    }
  }

  function drawCloak(sx, sy, hx, hy) {
    if (!CHAR.cloak) return;
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.moveTo(sx - 5, sy);
    ctx.quadraticCurveTo(sx - 12, sy + 8, hx - 10, hy + 8);
    ctx.quadraticCurveTo(hx - 14, hy + 18, hx - 10, hy + 28);
    ctx.quadraticCurveTo(hx - 6, hy + 12, hx - 8, hy + 5);
    ctx.closePath();
    ctx.fillStyle = ATT.tunic[1]; ctx.fill();
    ctx.strokeStyle = ATT.edge; ctx.lineWidth = 0.6; ctx.stroke();
    ctx.restore();
  }

  function drawCharacter() {
    var L0 = legState(0), L1s = legState(1);
    var bob = cfg.bob * Math.cos(2 * Math.PI * 2 * (phi - STANCE / 2));
    var ground = (surf(CX - 6) + surf(CX + 6)) / 2;
    var hx = CX, hy = ground - HIP_H - bob;
    var lean = 2.2 + (speedMul - 1) * 1.6;
    var sway = 0.8 * Math.sin(2 * Math.PI * phi);
    var sx = hx + lean + sway * .3, sy = hy - TORSO;

    if (FX.halo) {
      var hp = 1 + 0.08 * Math.sin(t * 2.2);
      var hg = ctx.createRadialGradient(sx + 1, sy - 6, 0, sx + 1, sy - 6, 40 * cfg.glow * hp);
      hg.addColorStop(0, rgba(FXC.light, .38)); hg.addColorStop(.5, rgba(FXC.light, .14)); hg.addColorStop(1, rgba(FXC.light, 0));
      ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(sx + 1, sy - 6, 40 * cfg.glow * hp, 0, Math.PI * 2); ctx.fill();
    }

    var rg = ctx.createRadialGradient(CX, ground + 2, 0, CX, ground + 2, 22);
    rg.addColorStop(0, rgba(WAT.reflect, .45)); rg.addColorStop(1, rgba(WAT.reflect, 0));
    ctx.save(); ctx.translate(0, ground + 2); ctx.scale(1, .25); ctx.translate(0, -(ground + 2));
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(CX, ground + 2, 22, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    drawCloak(sx, sy, hx, hy);
    drawStaff(sx - 1, sy + 2, 0.55 * L0.fwd);
    drawArm(sx - 1, sy + 2, 0.55 * L0.fwd, true);
    drawLeg(hx - 1, hy, L0, true);

    ctx.beginPath();
    ctx.moveTo(sx - 5.5, sy - 1);
    ctx.quadraticCurveTo(sx, sy - 3.5, sx + 5.5, sy - 1);
    ctx.lineTo(hx + 8.5, hy + 5);
    ctx.quadraticCurveTo(hx, hy + 8, hx - 8.5, hy + 5);
    ctx.closePath();
    var tg = ctx.createLinearGradient(hx - 8, sy, hx + 8, hy);
    tg.addColorStop(0, ATT.tunic[0]); tg.addColorStop(1, ATT.tunic[1]);
    ctx.fillStyle = tg; ctx.fill();
    ctx.strokeStyle = ATT.edge; ctx.lineWidth = .8; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx - 8.5, hy + 5); ctx.quadraticCurveTo(hx, hy + 8, hx + 8.5, hy + 5);
    ctx.strokeStyle = ATT.hem; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx - 4.5, hy - 5.5); ctx.lineTo(hx + 6.8 + lean * .3, hy - 4.6);
    ctx.strokeStyle = ATT.sash; ctx.lineWidth = 2.2; ctx.stroke();

    drawLeg(hx + 1, hy, L1s, false);

    var hdx = sx + 1.6, hdy = sy - 11.5 + 0.4 * Math.sin(2 * Math.PI * 2 * phi);
    if (FX.halo) {
      ctx.beginPath(); ctx.arc(hdx - .5, hdy - .5, 12.6, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(FXC.light, .55 + .15 * Math.sin(t * 2.2)); ctx.lineWidth = 1.3; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(hdx - 1, sy - 1.5, 2.6, 0, Math.PI * 2); ctx.fillStyle = CHAR.skinMid; ctx.fill();
    ctx.beginPath(); ctx.arc(hdx, hdy, 9.5, 0, Math.PI * 2); ctx.fillStyle = CHAR.skinBase; ctx.fill();

    drawHair(hdx, hdy);
    drawBeard(hdx, hdy);

    ctx.beginPath(); ctx.arc(hdx - 2.2, hdy + 1.2, 1.7, 0, Math.PI * 2); ctx.fillStyle = CHAR.skinMid; ctx.fill();
    ctx.beginPath(); ctx.arc(hdx + 5, hdy + 0.2, 1.25, 0, Math.PI * 2); ctx.fillStyle = "#1a1020"; ctx.fill();
    ctx.beginPath(); ctx.arc(hdx + 5.4, hdy - 0.2, 0.45, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill();
    ctx.beginPath(); ctx.arc(hdx + 5.2, hdy + 3.2, 2, 0.15 * Math.PI, 0.7 * Math.PI);
    ctx.strokeStyle = "#5a2e1c"; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); ctx.arc(hdx + 3.2, hdy + 3.4, 1.5, 0, Math.PI * 2); ctx.fillStyle = "rgba(243,16,186,.22)"; ctx.fill();
    ctx.beginPath(); ctx.arc(hdx, hdy, 10.3, -0.9, 0.9);
    ctx.strokeStyle = rgba(ATT.rim, .55); ctx.lineWidth = 1; ctx.stroke();

    drawArm(sx + 1, sy + 2, 0.55 * L1s.fwd, false);

    return { L: [L0, L1s], ground: ground };
  }

  /* ================= EFFECTS ================= */
  function addDrop(x, y, vx, vy, r) {
    if (drops.length > MAX_P) drops.shift();
    drops.push({ x: x, y: y, vx: vx, vy: vy, r: r, life: 0 });
  }
  function addSpark(x, y, max, s, delay) {
    if (sparks.length >= MAX_SPARKS) return;
    sparks.push({ x: x, y: y, life: -(delay || 0), max: max, s: s });
  }
  function footSplash(x, big) {
    var y = surf(x);
    var s = cfg.splash * (big ? 1.9 : 1);
    rings.push({ x: x, life: 0, max: (big ? 1.1 : 0.75), r0: 2, r1: cfg.ripple * s });
    var n = big ? 12 : (FX.splash ? 5 : 3);
    for (var i = 0; i < n; i++) addDrop(x + R(-3, 3), y - 1, R(-34, 22) * s, -R(30, 62) * s * (big ? 1.25 : 1), R(.8, 1.6));
    if (FX.splash && !big && Math.random() < .5) addSpark(x + R(-4, 4), y - R(3, 8), R(.3, .5), R(1.2, 2));
  }
  function burst(x, strong) {
    var s = cfg.splash * (strong ? 1.35 : 1);
    var y = surf(x);
    for (var i = 0; i < 9; i++) addDrop(x + R(-6, 6), y - 2, R(-45, 45) * s, -R(55, 95) * s, R(1, 1.9));
    glowRings.push({ x: x, life: 0, max: 1.5, r1: 92 });
    glowRings.push({ x: x, life: -0.22, max: 1.5, r1: 70 });
    for (var k = 0; k < 4; k++) addSpark(x + R(-26, 26), y - R(6, 34), R(.5, .9), R(2, 3.6));
  }

  function spawnEffect(e) {
    var x;
    switch (e) {
      case "sparkle": x = R(W * .15, W * .88); addSpark(x, surf(x) - R(1, 9), R(.45, .8), R(1.6, 3)); break;
      case "crystal": x = R(W * .12, W * .9); spawnP("gem", x, surf(x) - R(2, 16), 0, -R(2, 6), R(.7, 1.2), R(1.8, 3.2)); break;
      case "bubbles": x = R(10, W - 10); spawnP("bub", x, surf(x) + R(12, 40), 0, -R(9, 20), R(1.6, 3), R(1, 2.4)); break;
      case "stars": spawnP("star", R(10, W - 10), R(8, BASE - 34), 0, 0, R(1.4, 2.8), R(.7, 1.5)); break;
      case "floaters": x = R(W * .08, W * .92); spawnP("mote", x, surf(x) - R(0, 6), 0, -R(5, 12), R(2, 3.6), R(.7, 1.5)); break;
      case "energy": x = R(W * .14, W * .86); spawnP("bolt", x, 0, 0, 0, R(.16, .28), R(14, 30)); break;
      case "rings": x = R(W * .1, W * .9); rings.push({ x: x, life: 0, max: R(1, 1.5), r0: 2, r1: R(12, 24) * cfg.ripple / 15, c: OPEN.mid }); break;
    }
  }

  function fireIntro() {
    introDone = true;
    var gy = surf(CX), n;
    switch (FIRST_IMPRESSION.intro) {
      case "sparkle":
        for (n = 0; n < 8; n++) {
          var ang = n / 8 * Math.PI * 2 + R(-.2, .2);
          addSpark(CX + 3 + Math.cos(ang) * R(16, 32), gy - 24 + Math.sin(ang) * R(10, 20), R(.5, .8), R(1.8, 3.2), n * 0.04);
        }
        break;
      case "ripple":
        glowRings.push({ x: CX + 2, life: 0, max: 1.4, r1: 70 });
        glowRings.push({ x: CX + 2, life: -0.2, max: 1.4, r1: 50 });
        break;
      case "bubbles":
        for (n = 0; n < 10; n++) { var bx = CX + R(-44, 44); spawnP("bub", bx, surf(bx) + R(8, 26), 0, -R(18, 30), 2.2, R(1, 2.4)); }
        break;
      default:
        introFx = { k: FIRST_IMPRESSION.intro, life: 0, max: FIRST_IMPRESSION.intro === "shimmer" ? 1.1 : 1.2 };
    }
  }

  function drawIntro(dt) {
    if (!introFx) return;
    introFx.life += dt;
    var k = introFx.life / introFx.max;
    if (k >= 1) { introFx = null; return; }
    var env = Math.sin(Math.PI * k), g;
    ctx.save();
    if (introFx.k === "shimmer") {
      var px = -30 + (W + 60) * k;
      g = ctx.createLinearGradient(px - 34, 0, px + 34, 0);
      g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(.5, rgba("255,255,255", .9 * env)); g.addColorStop(1, "rgba(255,255,255,0)");
      crestPath(Math.max(-12, px - 40), Math.min(W + 12, px + 40), 0);
      ctx.strokeStyle = g; ctx.lineWidth = 2.8; ctx.stroke();
    } else if (introFx.k === "ray") {
      var gy = surf(CX);
      g = ctx.createLinearGradient(0, 0, 0, gy);
      g.addColorStop(0, rgba(FXC.light, 0)); g.addColorStop(.7, rgba(FXC.light, .38 * env)); g.addColorStop(1, rgba(FXC.light, .1 * env));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(CX - 6, 0); ctx.lineTo(CX + 12, 0); ctx.lineTo(CX + 28, gy); ctx.lineTo(CX - 22, gy); ctx.closePath(); ctx.fill();
    } else if (introFx.k === "pulse") {
      var r = 30 + 90 * k;
      g = ctx.createRadialGradient(CX + 2, BASE - 14, 0, CX + 2, BASE - 14, r);
      g.addColorStop(0, rgba(FXC.light, .26 * env)); g.addColorStop(1, rgba(FXC.light, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(CX + 2, BASE - 14, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function sparkShape(s) {
    ctx.beginPath();
    ctx.moveTo(0, -s); ctx.quadraticCurveTo(0, 0, s, 0); ctx.quadraticCurveTo(0, 0, 0, s);
    ctx.quadraticCurveTo(0, 0, -s, 0); ctx.quadraticCurveTo(0, 0, 0, -s);
  }

  function drawPool(layer) {
    for (var n = 0; n < POOL_N; n++) {
      var o = POOL[n];
      if (!o.on) continue;
      var L = o.k === "star" ? 0 : o.k === "bub" ? 1 : 2;
      if (L !== layer) continue;
      var k = clamp(o.life / o.max, 0, 1), env = Math.sin(Math.PI * k);
      if (o.k === "star") {
        var tw = env * (0.6 + 0.4 * Math.sin(t * 6 + o.ph));
        ctx.fillStyle = rgba(FXC.spark, .9 * tw);
        ctx.beginPath(); ctx.arc(o.x, o.y, o.s * .6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = rgba(FXC.spark, .45 * tw);
        ctx.fillRect(o.x - o.s * 2.2, o.y - .3, o.s * 4.4, .6);
        ctx.fillRect(o.x - .3, o.y - o.s * 2.2, .6, o.s * 4.4);
      } else if (o.k === "bub") {
        var ba = Math.min(1, o.life * 3);
        ctx.beginPath(); ctx.arc(o.x, o.y, o.s, 0, Math.PI * 2);
        ctx.strokeStyle = rgba(WAT.foam, .7 * ba); ctx.lineWidth = .8; ctx.stroke();
        ctx.beginPath(); ctx.arc(o.x - o.s * .35, o.y - o.s * .35, o.s * .3, 0, Math.PI * 2);
        ctx.fillStyle = rgba("255,255,255", .85 * ba); ctx.fill();
      } else if (o.k === "gem") {
        var gs2 = o.s * (0.6 + 0.4 * env);
        ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.ph + o.life * 2);
        ctx.beginPath(); ctx.moveTo(0, -gs2 * 1.4); ctx.lineTo(gs2 * .8, 0); ctx.lineTo(0, gs2 * 1.4); ctx.lineTo(-gs2 * .8, 0); ctx.closePath();
        ctx.fillStyle = rgba(OPEN.mid, .75 * env); ctx.fill();
        ctx.strokeStyle = rgba("255,255,255", .9 * env); ctx.lineWidth = .6; ctx.stroke();
        ctx.restore();
      } else if (o.k === "mote") {
        ctx.fillStyle = rgba(FXC.mote, .16 * env);
        ctx.beginPath(); ctx.arc(o.x, o.y, o.s * 2.6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = rgba(FXC.mote, .8 * env);
        ctx.beginPath(); ctx.arc(o.x, o.y, o.s, 0, Math.PI * 2); ctx.fill();
      } else if (o.k === "bolt") {
        var fl = (1 - k) * (0.6 + 0.4 * Math.random());
        ctx.beginPath();
        for (var s = 0; s <= 6; s++) {
          var bx = o.x - o.s / 2 + o.s * s / 6;
          var by = surf(bx) - 1 + (s === 0 || s === 6 ? 0 : R(-2.6, 2.6));
          s === 0 ? ctx.moveTo(bx, by) : ctx.lineTo(bx, by);
        }
        ctx.lineJoin = "round";
        ctx.strokeStyle = rgba(FXC.light, .4 * fl); ctx.lineWidth = 3.2; ctx.stroke();
        ctx.strokeStyle = rgba("255,255,255", .95 * fl); ctx.lineWidth = .9; ctx.stroke();
      }
    }
  }

  function drawEffects(dt) {
    var i, o, k;
    for (i = rings.length - 1; i >= 0; i--) {
      o = rings[i]; o.life += dt;
      k = o.life / o.max;
      if (k >= 1) { rings.splice(i, 1); continue; }
      var rr = o.r0 + (o.r1 - o.r0) * (1 - Math.pow(1 - k, 2));
      ctx.beginPath(); ctx.ellipse(o.x, surf(o.x) + 1.5, rr, rr * .26, 0, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(o.c || WAT.ripple, 0.75 * (1 - k)); ctx.lineWidth = 1.1; ctx.stroke();
    }
    for (i = glowRings.length - 1; i >= 0; i--) {
      o = glowRings[i]; o.life += dt;
      if (o.life < 0) continue;
      k = o.life / o.max;
      if (k >= 1) { glowRings.splice(i, 1); continue; }
      var gr = 6 + o.r1 * (1 - Math.pow(1 - k, 3));
      var gy = surf(o.x) + 2;
      ctx.save();
      ctx.shadowColor = rgba(OPEN.edge, .9); ctx.shadowBlur = 8 * cfg.glow;
      ctx.beginPath(); ctx.ellipse(o.x, gy, gr, gr * .2, 0, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(OPEN.mid, 0.9 * (1 - k) * cfg.glow); ctx.lineWidth = 1.8 * (1 - k) + .5; ctx.stroke();
      ctx.restore();
    }
    for (i = drops.length - 1; i >= 0; i--) {
      o = drops[i]; o.life += dt;
      o.vy += 260 * dt; o.x += o.vx * dt; o.y += o.vy * dt;
      if (o.vy > 0 && o.y > surf(o.x) + 1) { drops.splice(i, 1); continue; }
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
      ctx.fillStyle = rgba(WAT.drop, .92); ctx.fill();
    }
    drawPool(2);
    for (i = sparks.length - 1; i >= 0; i--) {
      o = sparks[i]; o.life += dt;
      if (o.life < 0) continue;
      k = o.life / o.max;
      if (k >= 1) { sparks.splice(i, 1); continue; }
      var s = o.s * Math.sin(Math.PI * k);
      ctx.save(); ctx.translate(o.x, o.y);
      ctx.fillStyle = rgba(FXC.spark, 0.9 * Math.sin(Math.PI * k));
      sparkShape(s); ctx.fill();
      ctx.restore();
    }
    drawIntro(dt);
  }

  function edgeMask() {
    ctx.save();
    ctx.globalCompositeOperation = "destination-in";
    var g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(.13, "rgba(0,0,0,1)");
    g.addColorStop(.87, "rgba(0,0,0,1)"); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  /* ================= FRAME ================= */
  var sparkTimer = R(0.6, 1.6);

  function step(dt) {
    if (boostUntil && t > boostUntil) { boostUntil = 0; }
    var target = boostUntil ? 2.5 : 1;
    speedMul += (target - speedMul) * Math.min(1, dt * 9);

    t += dt;
    phi = (phi + dt * speedMul / cfg.walkT) % 1;
    var prevU = u;
    u += dt * speedMul / LOOP;
    if (prevU < U_BURST && u >= U_BURST) burst(openX(U_BURST), false);
    if (u >= 1) u -= 1;

    var drift = gs * speedMul * dt;
    for (var i = 0; i < flecks.length; i++) {
      flecks[i].x -= drift;
      if (flecks[i].x < -20) { flecks[i].x = W + R(5, 40); flecks[i].len = R(5, 13); }
    }
    for (i = 0; i < rings.length; i++) rings[i].x -= drift;
    for (i = 0; i < glowRings.length; i++) glowRings[i].x -= drift;
    for (i = 0; i < drops.length; i++) drops[i].x -= drift * .6;
    for (i = 0; i < sparks.length; i++) sparks[i].x -= drift * .5;
    for (i = 0; i < mist.length; i++) {
      mist[i].x -= drift * mist[i].sp;
      if (mist[i].x < -mist[i].r) mist[i].x = W + mist[i].r;
    }

    for (i = 0; i < POOL_N; i++) {
      var o = POOL[i];
      if (!o.on) continue;
      o.life += dt;
      if (o.life >= o.max) { o.on = false; continue; }
      var dm = o.k === "star" ? .08 : o.k === "mote" ? .6 : o.k === "bolt" ? 1 : .9;
      o.x -= drift * dm;
      if (o.k === "mote") o.vx = 4 * Math.sin(o.life * 2 + o.ph);
      o.x += o.vx * dt; o.y += o.vy * dt;
      if (o.k === "bub" && o.y <= surf(o.x) + 1.5) {
        o.on = false;
        if (Math.random() < .35) rings.push({ x: o.x, life: 0, max: .5, r0: 1, r1: 5, c: WAT.foam });
        continue;
      }
      if (o.x < -24) o.on = false;
    }

    for (var e in effT) {
      effT[e] -= dt * cfg.pfreq;
      if (effT[e] <= 0) { effT[e] = R(RATES[e][0], RATES[e][1]); spawnEffect(e); }
    }

    sparkTimer -= dt;
    if (sparkTimer <= 0) {
      sparkTimer = R(1.0, 2.4);
      var sx = R(W * .18, W * .86);
      addSpark(sx, surf(sx) - R(1, 5), R(.45, .75), R(1.6, 2.8));
    }

    if (!introDone && t >= introAt) fireIntro();
  }

  function render(dt) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    /* DIRECTION FLIP: mirror the entire canvas when walking left */
    if (DIR === -1) {
      ctx.setTransform(-scale, 0, 0, scale, canvas.width, 0);
    } else {
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
    }

    drawRays();
    drawPool(0);
    drawWater();
    drawPool(1);
    var c = drawCharacter();
    drawFront();
    drawMist();
    drawEffects(dt);
    edgeMask();

    if (dt > 0) {
      for (var i = 0; i < 2; i++) {
        var p = c.L[i].p;
        if (p < lastP[i] - 0.5) footSplash(c.L[i].x + 2, false);
        lastP[i] = p;
      }
    }
  }

  var running = false, lastTs = 0, rafId = 0, visible = true;
  function loop(ts) {
    if (!running) return;
    var dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
    lastTs = ts;
    step(dt);
    render(dt);
    rafId = requestAnimationFrame(loop);
  }
  function start() {
    if (running || reduced || !visible || document.hidden) return;
    running = true; lastTs = 0; rafId = requestAnimationFrame(loop);
  }
  function stop() { running = false; cancelAnimationFrame(rafId); }

  function drawStatic() {
    t = 0.8; phi = 0.15; u = 0.4;
    drops = []; rings = []; glowRings = []; sparks = []; introFx = null;
    for (var n = 0; n < POOL_N; n++) POOL[n].on = false;
    render(0);
  }

  if (FX.stars) for (i = 0; i < 6; i++) { var st = spawnP("star", R(10, W - 10), R(8, BASE - 34), 0, 0, R(1.6, 2.8), R(.7, 1.5)); if (st) st.life = R(0, st.max * .6); }

  /* ================= INTERACTION ================= */
  var cta = document.getElementById("wowCta");
  var modal = document.getElementById("wowModal");
  var frame = document.getElementById("wowFrame");
  var closeBtn = document.getElementById("wowClose");
  var tapRings = stage.querySelectorAll(".wow-tapring");
  var busy = false, isOpen = false, openTimer = 0;

  function playTapRings() {
    var cx = CX + 2;
    var fx = DIR === 1 ? cx / W * 100 : (W - cx) / W * 100;
    var fy = (surf(CX) / H) * 100;
    for (var i = 0; i < tapRings.length; i++) {
      var el = tapRings[i];
      el.style.setProperty("--x", fx + "%"); el.style.setProperty("--y", fy + "%");
      el.classList.remove("go"); void el.offsetWidth; el.classList.add("go");
    }
  }

  cta.addEventListener("click", function () {
    if (busy || isOpen) return;
    busy = true;
    if (reduced) { openVideo(); return; }
    boostUntil = t + 0.42;
    footSplash(CX + 4, true);
    burst(CX + 2, true);
    playTapRings();
    openTimer = setTimeout(openVideo, 520);
  });

  function openVideo() {
    clearTimeout(openTimer);
    isOpen = true;
    fitModal();
    frame.src = EMBED_URL;
    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
    stop();
    setTimeout(function () { try { closeBtn.focus({ preventScroll: true }); } catch (e) { closeBtn.focus(); } }, 30);
    reportHeight();
  }

  function closeVideo() {
    if (!isOpen) return;
    isOpen = false; busy = false;
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");
    frame.src = "about:blank";
    setTimeout(function () { if (!isOpen) frame.removeAttribute("src"); }, 50);
    root.style.minHeight = "";
    try { cta.focus({ preventScroll: true }); } catch (e) { cta.focus(); }
    start();
    reportHeight();
  }

  function fitModal() {
    var w = Math.min(root.clientWidth - 24, 960);
    var need = Math.ceil(w * 9 / 16 + 110);
    root.style.minHeight = Math.max(need, 0) + "px";
  }

  closeBtn.addEventListener("click", closeVideo);
  modal.addEventListener("click", function (e) {
    if (e.target === modal || e.target.hasAttribute("data-wow-close")) closeVideo();
  });
  document.addEventListener("keydown", function (e) {
    if (isOpen && (e.key === "Escape" || e.key === "Esc")) { e.preventDefault(); closeVideo(); }
    if (isOpen && e.key === "Tab") {
      var f = [closeBtn, modal.querySelector(".wow-alt a")];
      var i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    }
  });

  var lastH = 0;
  function reportHeight() {
    var h = Math.ceil(root.getBoundingClientRect().height);
    if (h === lastH) return;
    lastH = h;
    try { window.parent.postMessage({ type: "gei-widget-height", id: "walk-on-water-cta", height: h }, "*"); } catch (e) {}
  }
  if ("ResizeObserver" in window) {
    new ResizeObserver(function () { resize(); if (isOpen) fitModal(); reportHeight(); }).observe(root);
  } else {
    window.addEventListener("resize", function () { resize(); if (isOpen) fitModal(); reportHeight(); });
  }
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (es) {
      visible = es[0].isIntersecting;
      if (visible && !isOpen) start(); else stop();
    }).observe(stage);
  }
  document.addEventListener("visibilitychange", function () { if (document.hidden) stop(); else if (!isOpen) start(); });

  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
    var onMq = function () { reduced = mq.matches; if (reduced) { stop(); drawStatic(); } else if (!isOpen) start(); };
    if (mq.addEventListener) mq.addEventListener("change", onMq); else if (mq.addListener) mq.addListener(onMq);
  }

  resize();
  if (reduced) drawStatic(); else start();
  reportHeight();
})();
</script>
</body>
</html>
