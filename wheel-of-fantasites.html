<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a1628">
<title>Wheel of Fantasites — YallToo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --cyan: #2fd2ff;
  --indigo: #3d3dea;
  --magenta: #f310ba;
  --pink: #ff9df2;
  --bg1: #0a1628;
  --bg2: #0f1d35;
  --bg3: #162544;
  --wood1: #8B6914;
  --wood2: #A0762C;
  --iron: #5a5a6e;
  --gold: #ffd700;
  --yellow: #ffe44d;
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  width: 100%; height: 100vh; height: 100dvh;
  overflow: hidden;
}
body {
  width: 100%; height: 100vh; height: 100dvh;
  overflow: hidden;
  font-family: var(--font);
  background: var(--bg1);
  background-image: radial-gradient(ellipse at 50% 40%, rgba(47,210,255,0.07), rgba(243,16,186,0.04) 40%, transparent 70%);
  color: #e8ecf2;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  display: flex; flex-direction: column; align-items: center;
  padding: 0 0 env(safe-area-inset-bottom, 0);
}

/* ── TOP BAR ── */
.top-bar {
  display: flex; align-items: center; justify-content: center;
  padding: 4px 12px;
  position: relative; width: 100%; flex-shrink: 0;
}
.top-bar h1 {
  font-size: clamp(0.9rem, 3.2vw, 1.4rem);
  font-weight: 900; letter-spacing: .04em;
  background: linear-gradient(100deg, var(--cyan), var(--magenta), var(--yellow));
  background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: titleShimmer 4s ease infinite;
}
.top-bar .audio-icon {
  position: absolute; right: 12px; top: 50%;
  transform: translateY(-50%);
}
@keyframes titleShimmer {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

/* ── WHEEL AREA ── */
.wheel-area {
  flex: 1; min-height: 0;
  width: 100%; max-width: 700px;
  position: relative;
  display: flex; justify-content: center; align-items: center;
  padding: 0;
}
.wheel-area::before {
  content: ''; position: absolute;
  width: 80%; height: 80%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(47,210,255,0.06), rgba(243,16,186,0.03), transparent 70%);
  pointer-events: none;
}
.wheel-area canvas {
  display: block; border-radius: 12px;
}

/* ── CONTROLS STRIP ── */
.controls-strip {
  display: flex; gap: 10px;
  padding: 4px 12px;
  width: 100%; max-width: 660px;
  align-items: stretch;
  flex-shrink: 0;
  border-top: 1px solid rgba(47,210,255,0.15);
}
.valve-col {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.valve-canvas {
  width: 80px; height: 110px;
  cursor: grab; touch-action: none;
  border-radius: 14px;
  background: radial-gradient(ellipse at 50% 45%, var(--bg3), var(--bg1));
  border: 1.5px solid rgba(47,210,255,0.2);
}
.valve-canvas:active { cursor: grabbing; }
.valve-buttons {
  display: flex; gap: 4px;
}
.valve-btn {
  width: 38px; height: 34px;
  border: 1.5px solid rgba(47,210,255,0.3);
  border-radius: 8px;
  background: linear-gradient(180deg, var(--bg3), var(--bg2));
  color: var(--cyan);
  font-size: 1.1rem; font-weight: 900;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, border-color .15s;
  -webkit-user-select: none; user-select: none;
}
.valve-btn:hover, .valve-btn:active {
  background: rgba(47,210,255,.15);
  border-color: var(--cyan);
}
.valve-btn:disabled { opacity: .3; cursor: default; }

.info-col {
  flex: 1; display: flex; flex-direction: column;
  gap: 5px; min-width: 0;
  justify-content: center;
}

/* ── ANNOUNCER ── */
.announcer {
  padding: 6px 10px;
  background: rgba(22,37,68,0.7);
  border: 1px solid rgba(47,210,255,0.2);
  border-radius: 10px;
  text-align: center;
  transition: border-color .3s, box-shadow .3s;
}
.announcer.active {
  border-color: var(--cyan);
  box-shadow: 0 0 12px rgba(47,210,255,0.15);
}
.announcer .personality {
  font-size: .55rem; font-weight: 800;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--magenta); margin-bottom: 1px;
}
.announcer .phrase {
  font-size: clamp(.72rem, 2.2vw, .88rem);
  font-weight: 700; line-height: 1.25;
  color: #fff; min-height: 1.2em;
}

/* ── METERS ── */
.meters { display: flex; flex-direction: column; gap: 4px; }
.gate-meter, .pressure-gauge {
  display: flex; align-items: center; gap: 6px;
}
.gate-label, .pressure-label {
  font-size: .6rem; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase;
  color: rgba(255,255,255,.55);
  white-space: nowrap; min-width: 28px;
}
.gate-bar-track, .pressure-bar-track {
  flex: 1; height: 10px;
  background: var(--bg1);
  border-radius: 5px;
  border: 1px solid rgba(47,210,255,0.15);
  overflow: hidden;
}
.gate-bar-fill {
  height: 100%; border-radius: 5px;
  background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--yellow));
  width: 0%; transition: width .15s;
}
.gate-status {
  font-size: .55rem; font-weight: 700;
  color: var(--cyan); min-width: 44px; text-align: right;
}
.pressure-bar-fill {
  height: 100%; border-radius: 5px;
  background: linear-gradient(90deg, var(--cyan), var(--magenta));
  width: 0%; transition: width .1s;
}

/* ── AUDIO ICON ── */
.audio-icon {
  width: 30px; height: 30px;
  border: 1px solid rgba(47,210,255,0.2); border-radius: 8px;
  background: rgba(22,37,68,0.6);
  color: var(--cyan);
  font-size: 1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.audio-icon:hover { background: rgba(47,210,255,.15); }

/* ── REPLAY BUTTON ── */
.replay-btn {
  position: fixed;
  bottom: 44px; left: 50%; transform: translateX(-50%);
  z-index: 100;
  padding: 10px 28px;
  border: 2px solid var(--cyan);
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(47,210,255,.2), rgba(61,61,234,.2));
  color: var(--cyan);
  font-family: var(--font);
  font-size: .9rem; font-weight: 900;
  letter-spacing: .06em;
  cursor: pointer;
  display: none;
  transition: background .2s, transform .15s;
  box-shadow: 0 4px 20px rgba(47,210,255,.2);
}
.replay-btn:hover {
  background: linear-gradient(135deg, rgba(47,210,255,.3), rgba(61,61,234,.3));
}
.replay-btn.visible { display: block; }

/* ── HISTORY STRIP ── */
.history-strip {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 12px 6px;
  width: 100%; max-width: 660px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  flex-shrink: 0;
}
.history-strip::-webkit-scrollbar { display: none; }
.history-strip { scrollbar-width: none; }
.history-list {
  display: flex; gap: 4px; flex: 1; min-width: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.history-list::-webkit-scrollbar { display: none; }
.history-list { scrollbar-width: none; }
.history-item {
  padding: 3px 8px;
  background: rgba(22,37,68,0.6);
  border: 1px solid rgba(47,210,255,0.2);
  border-radius: 999px;
  font-size: .6rem; font-weight: 600;
  color: rgba(255,255,255,.75);
  white-space: nowrap; flex-shrink: 0;
}
.history-item .num {
  color: var(--cyan); margin-right: 3px; font-weight: 800;
}
.history-empty {
  font-size: .6rem; color: rgba(255,255,255,.3);
  font-style: italic; white-space: nowrap;
}
.history-clear {
  font-size: .7rem; font-weight: 700;
  color: var(--magenta);
  background: none; border: none;
  cursor: pointer; padding: 4px;
  flex-shrink: 0; line-height: 1;
}
.history-clear:hover { color: var(--pink); }

/* ── PRIZE MODAL ── */
.prize-overlay {
  position: fixed; inset: 0;
  background: rgba(10,22,40,.92);
  z-index: 1000;
  display: none; align-items: center; justify-content: center;
  padding: 16px;
  animation: fadeIn .4s ease;
}
.prize-overlay.visible { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.prize-card {
  width: 100%; max-width: 440px;
  background: linear-gradient(160deg, var(--bg2), var(--bg3));
  border: 2px solid var(--gold);
  border-radius: 20px;
  padding: clamp(16px, 3.5vw, 28px);
  text-align: center;
  position: relative; overflow: hidden;
  animation: prizeSlideUp .5s ease;
  box-shadow: 0 0 50px rgba(255,215,0,.15), 0 0 100px rgba(47,210,255,.08);
}
@keyframes prizeSlideUp {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.prize-card::before {
  content: ''; position: absolute; inset: -2px;
  background: conic-gradient(var(--gold), var(--cyan), var(--magenta), var(--gold));
  border-radius: 22px; z-index: -1;
  animation: prizeGlow 3s linear infinite;
}
@keyframes prizeGlow {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}
.prize-free-tag {
  display: inline-block;
  padding: 5px 18px;
  background: linear-gradient(135deg, var(--gold), #ffaa00);
  color: var(--bg1);
  font-size: clamp(.8rem, 2.5vw, 1rem);
  font-weight: 900; letter-spacing: .08em;
  border-radius: 999px; margin-bottom: 8px;
  box-shadow: 0 4px 14px rgba(255,215,0,.3);
}
.prize-winner-name {
  font-size: clamp(1.2rem, 3.8vw, 1.8rem);
  font-weight: 900; line-height: 1.2; color: #fff;
  margin: 6px 0;
  text-shadow: 0 0 16px rgba(47,210,255,.4);
}
.prize-congrats {
  font-size: clamp(.75rem, 2vw, .9rem);
  font-weight: 700; line-height: 1.45;
  color: rgba(255,255,255,.85);
  margin: 6px 0 10px;
}
.prize-congrats .value { color: var(--gold); font-weight: 900; }
.prize-images {
  display: flex; gap: 6px;
  justify-content: center; margin: 10px 0;
}
.prize-images img {
  width: 28%; max-width: 110px;
  aspect-ratio: 1; object-fit: cover;
  border-radius: 10px;
  border: 2px solid rgba(255,215,0,.3);
  background: var(--bg1);
}
.prize-close {
  margin-top: 10px;
  padding: 10px 24px;
  border: 2px solid var(--cyan);
  border-radius: 12px;
  background: rgba(47,210,255,.12);
  color: var(--cyan);
  font-family: var(--font);
  font-size: .85rem; font-weight: 800;
  cursor: pointer;
  transition: background .2s;
}
.prize-close:hover { background: rgba(47,210,255,.22); }

/* ── EFFECTS ── */
.landing-flash {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 900;
  opacity: 0; transition: opacity .15s;
}
.landing-flash.gold { background: radial-gradient(circle, rgba(255,215,0,.3), transparent 70%); }
.landing-flash.blue { background: radial-gradient(circle, rgba(47,210,255,.3), transparent 70%); }
.landing-flash.red { background: radial-gradient(circle, rgba(255,40,40,.25), transparent 70%); }
.landing-flash.magenta { background: radial-gradient(circle, rgba(243,16,186,.25), transparent 70%); }
.landing-flash.visible { opacity: 1; }

.confetti-container {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 950; overflow: hidden;
}
.confetti-piece {
  position: absolute; width: 8px; height: 12px;
  top: -20px; animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

@keyframes shake {
  0%, 100% { transform: translate(0); }
  10% { transform: translate(-3px, 2px); }
  20% { transform: translate(3px, -2px); }
  30% { transform: translate(-2px, 3px); }
  40% { transform: translate(2px, -3px); }
  50% { transform: translate(-3px, 1px); }
  60% { transform: translate(3px, -1px); }
  70% { transform: translate(-1px, 2px); }
  80% { transform: translate(1px, -2px); }
  90% { transform: translate(-2px, 1px); }
}
.shake { animation: shake .4s ease; }

.surge-overlay {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 800;
  background: radial-gradient(ellipse at bottom, rgba(47,210,255,.18), transparent 60%);
  opacity: 0; transition: opacity .3s;
}
.surge-overlay.visible { opacity: 1; }

/* ── POINTER GLOW PULSE ── */
@keyframes ptrPulse {
  0%, 100% { filter: drop-shadow(0 0 8px rgba(255,51,102,0.5)); }
  50% { filter: drop-shadow(0 0 16px rgba(255,51,102,0.8)); }
}

/* ── DESKTOP ── */
@media (min-width: 768px) {
  .wheel-area { max-width: 600px; }
  .controls-strip { gap: 16px; }
}
@media (min-width: 1024px) {
  body { justify-content: center; }
  .wheel-area { max-width: 560px; }
}

/* ── REDUCED MOTION ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <h1>WHEEL OF FANTASITES</h1>
  <button class="audio-icon" id="muteBtn" aria-label="Toggle sound">&#x1f50a;</button>
</div>

<!-- WATERWHEEL CANVAS -->
<div class="wheel-area" id="wheelArea">
  <canvas id="wheelCanvas" width="700" height="700"></canvas>
</div>

<!-- CONTROLS STRIP -->
<div class="controls-strip">
  <div class="valve-col">
    <canvas class="valve-canvas" id="valveCanvas" width="160" height="220"></canvas>
    <div class="valve-buttons">
      <button class="valve-btn" id="btnCCW" aria-label="Close valve (counterclockwise)" title="Close">&#x21BA;</button>
      <button class="valve-btn" id="btnCW" aria-label="Open valve (clockwise)" title="Open">&#x21BB;</button>
    </div>
  </div>
  <div class="info-col">
    <div class="announcer" id="announcer">
      <div class="personality" id="announcerName">&nbsp;</div>
      <div class="phrase" id="announcerPhrase">Drag the T-valve &#x21BB; to release the water!</div>
    </div>
    <div class="meters">
      <div class="gate-meter">
        <span class="gate-label">Gate</span>
        <div class="gate-bar-track"><div class="gate-bar-fill" id="gateFill"></div></div>
        <span class="gate-status" id="gateStatus">CLOSED</span>
      </div>
      <div class="pressure-gauge">
        <span class="pressure-label">PSI</span>
        <div class="pressure-bar-track"><div class="pressure-bar-fill" id="pressureFill"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- REPLAY (floating) -->
<button class="replay-btn" id="replayBtn">SPIN AGAIN</button>

<!-- HISTORY STRIP -->
<div class="history-strip" id="historyPanel">
  <div class="history-list" id="historyList">
    <span class="history-empty">No spins yet</span>
  </div>
  <button class="history-clear" id="historyClear">&#x2715;</button>
</div>

<!-- EFFECTS OVERLAYS -->
<div class="landing-flash" id="landingFlash"></div>
<div class="confetti-container" id="confettiContainer"></div>
<div class="surge-overlay" id="surgeOverlay"></div>

<!-- PRIZE MODAL -->
<div class="prize-overlay" id="prizeOverlay">
  <div class="prize-card">
    <div class="prize-free-tag">FREE PRIZE</div>
    <div class="prize-winner-name" id="prizeWinnerName"></div>
    <div class="prize-congrats">
      CONGRATULATIONS! YOU'VE WON<br>
      <strong>FREE YALLTOO TEA</strong><br>
      A PRIZE VALUED AT <span class="value">$666</span>!
    </div>
    <div class="prize-images">
      <img src="https://assets.zyrosite.com/YZ9jg46Bljs5wOZR/yalltoo-teas-Rp9UZDwbCa1HlOKq.jpg" alt="YallToo Teas Collection" loading="lazy"
        onerror="this.style.display='none'">
      <img src="https://assets.zyrosite.com/YZ9jg46Bljs5wOZR/yalltoo-tea-Zt9cpwoNZ66phxAU.jpg" alt="YallToo Tea" loading="lazy"
        onerror="this.style.display='none'">
      <img src="https://assets.zyrosite.com/YZ9jg46Bljs5wOZR/pure-yalltoo-tea-gfsrmqb95Iula6R9.png" alt="Pure YallToo Tea" loading="lazy"
        onerror="this.style.display='none'">
    </div>
    <button class="prize-close" id="prizeClose">AMAZING!</button>
  </div>
</div>

<script>
(function() {
"use strict";

/* ── NAMES ── */
const NAMES = [
  "Dane Callaway","19 Keys","Bro Sanchez","Dr. Yahki","Billy Carson",
  "Bobby Hemmit","Dr York","Doctah B Sirius","Terrance Howard","Dr Umar",
  "Young Pharaoh","General seti","Saneter","Rizza Islam","Bro Polight",
  "Phil Valentine","Brother Panic","Nuwaubians","Jabari Osaze",
  "Captain Tazaryach","Tariq Nasheed","House of Konsciousness",
  "Judge Joe Brown","607 Unk","Bro AnkhMm","FBA"
];
const N = NAMES.length;
const SLICE = (Math.PI * 2) / N;

/* ── COLORS ── */
const WOOD_COLORS = [];
for (let i = 0; i < N; i++) {
  const h = 30 + (i % 5) * 4;
  const s = 55 + (i % 3) * 8;
  const l = 28 + (i % 4) * 5;
  WOOD_COLORS.push(`hsl(${h},${s}%,${l}%)`);
}
const WOOD_HIGHLIGHTS = [];
for (let i = 0; i < N; i++) {
  const h = 30 + (i % 5) * 4;
  const s = 45 + (i % 3) * 6;
  const l = 42 + (i % 4) * 4;
  WOOD_HIGHLIGHTS.push(`hsl(${h},${s}%,${l}%)`);
}

/* ── DOM REFS ── */
const wheelCanvas = document.getElementById('wheelCanvas');
const wheelCtx = wheelCanvas.getContext('2d');
const valveCanvas = document.getElementById('valveCanvas');
const valveCtx = valveCanvas.getContext('2d');
const announcerEl = document.getElementById('announcer');
const announcerNameEl = document.getElementById('announcerName');
const announcerPhraseEl = document.getElementById('announcerPhrase');
const gateFill = document.getElementById('gateFill');
const gateStatus = document.getElementById('gateStatus');
const pressureFill = document.getElementById('pressureFill');
const replayBtn = document.getElementById('replayBtn');
const muteBtn = document.getElementById('muteBtn');
const historyList = document.getElementById('historyList');
const historyClear = document.getElementById('historyClear');
const prizeOverlay = document.getElementById('prizeOverlay');
const prizeWinnerName = document.getElementById('prizeWinnerName');
const prizeClose = document.getElementById('prizeClose');
const landingFlash = document.getElementById('landingFlash');
const confettiContainer = document.getElementById('confettiContainer');
const surgeOverlay = document.getElementById('surgeOverlay');
const btnCW = document.getElementById('btnCW');
const btnCCW = document.getElementById('btnCCW');

/* ── GAME STATE ── */
const STATE = { READY: 0, OPENING: 1, SPINNING: 2, CLOSING: 3, LANDING: 4, LANDED: 5, REPLAY: 6 };
let gameState = STATE.READY;
let gateOpenness = 0;
let pressure = 0;
let wheelAngle = 0;
let wheelSpeed = 0;
let selectedIndex = -1;
let targetAngle = 0;
let spinCount = 0;
let lastPhraseIdx = -1;
let lastPersonalityIdx = -1;
let lastEffectIdx = -1;
let spinTimer = 0;
let surgeTriggered = false;
let valveAngle = 0;
let valveDragging = false;
let valveLastAngle = 0;

/* ── AUDIO ENGINE ── */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let masterGain = null;
let muted = false;
let volume = 0.6;
let waterNoiseNode = null;
let waterNoiseGain = null;

function ensureAudio() {
  if (!AudioCtx) return null;
  if (!audioCtx) {
    audioCtx = new AudioCtx();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = volume;
    masterGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  return audioCtx;
}

function setVolume(v) {
  volume = v;
  if (masterGain) masterGain.gain.setTargetAtTime(muted ? 0 : v, audioCtx.currentTime, 0.05);
}

function toggleMute() {
  muted = !muted;
  muteBtn.textContent = muted ? '\u{1F507}' : '\u{1F50A}';
  if (masterGain) masterGain.gain.setTargetAtTime(muted ? 0 : volume, audioCtx.currentTime, 0.05);
}

function playTone(freq, dur, type, gain, delay, endFreq) {
  const c = ensureAudio(); if (!c) return;
  type = type || 'sine'; gain = gain || 0.04; delay = delay || 0; endFreq = endFreq || freq;
  const t = c.currentTime + delay;
  const o = c.createOscillator();
  const g = c.createGain();
  const f = c.createBiquadFilter();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), t + dur);
  f.type = 'lowpass'; f.frequency.setValueAtTime(4500, t);
  f.frequency.exponentialRampToValueAtTime(800, t + dur);
  g.gain.setValueAtTime(0.001, t);
  g.gain.linearRampToValueAtTime(gain, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(f); f.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + dur + 0.05);
}

function playNoise(dur, gain, delay, freqCenter, q) {
  const c = ensureAudio(); if (!c) return;
  dur = dur || 0.2; gain = gain || 0.03; delay = delay || 0;
  freqCenter = freqCenter || 1800; q = q || 1.5;
  const t = c.currentTime + delay;
  const buf = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = c.createBufferSource(); src.buffer = buf;
  const flt = c.createBiquadFilter();
  flt.type = 'bandpass'; flt.frequency.setValueAtTime(freqCenter, t); flt.Q.value = q;
  const g = c.createGain();
  g.gain.setValueAtTime(0.001, t);
  g.gain.linearRampToValueAtTime(gain, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(flt); flt.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t + dur + 0.02);
}

function startWaterNoise() {
  const c = ensureAudio(); if (!c || waterNoiseNode) return;
  const bufLen = c.sampleRate * 2;
  const buf = c.createBuffer(1, bufLen, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) d[i] = Math.random() * 2 - 1;
  waterNoiseNode = c.createBufferSource();
  waterNoiseNode.buffer = buf; waterNoiseNode.loop = true;
  const flt = c.createBiquadFilter();
  flt.type = 'lowpass'; flt.frequency.value = 900;
  waterNoiseGain = c.createGain();
  waterNoiseGain.gain.value = 0;
  waterNoiseNode.connect(flt); flt.connect(waterNoiseGain); waterNoiseGain.connect(masterGain);
  waterNoiseNode.start();
}

function setWaterLevel(level) {
  if (waterNoiseGain) {
    const c = ensureAudio();
    if (c) waterNoiseGain.gain.setTargetAtTime(level * 0.04, c.currentTime, 0.1);
  }
}

function stopWaterNoise() {
  if (waterNoiseNode) { try { waterNoiseNode.stop(); } catch(e){} waterNoiseNode = null; waterNoiseGain = null; }
}

/* ── WATER PARTICLES ── */
const waterParticles = [];
const MAX_PARTICLES = 80;
function initWaterParticles() {
  for (let i = 0; i < MAX_PARTICLES; i++) {
    waterParticles.push({
      x: Math.random(), y: Math.random(),
      vx: (Math.random() - 0.5) * 0.002,
      vy: Math.random() * 0.003 + 0.001,
      r: Math.random() * 3 + 1,
      alpha: Math.random() * 0.4 + 0.1,
    });
  }
}
initWaterParticles();

function updateWaterParticles(flow) {
  for (const p of waterParticles) {
    p.x += p.vx * flow;
    p.y += p.vy * flow;
    if (p.y > 1.1) { p.y = -0.1; p.x = Math.random(); }
    if (p.x < -0.1) p.x = 1.1;
    if (p.x > 1.1) p.x = -0.1;
  }
}

/* ── DRAW WHEEL ── */
let animTime = 0;
let highlightSlot = -1;
let highlightAlpha = 0;

function drawWheel() {
  const w = parseInt(wheelCanvas.style.width) || wheelCanvas.width;
  const h = parseInt(wheelCanvas.style.height) || wheelCanvas.height;
  const cx = w / 2;
  const cy = h / 2;
  const outerR = w * 0.46;
  const innerR = w * 0.14;
  const paddleR = w * 0.47;
  const ctx = wheelCtx;

  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, wheelCanvas.width, wheelCanvas.height);
  ctx.restore();

  /* Water background */
  const flow = Math.max(pressure, gateOpenness * 0.3);
  updateWaterParticles(flow + 0.3);
  ctx.save();
  for (const p of waterParticles) {
    const px = p.x * w;
    const py = p.y * h;
    const dist = Math.sqrt((px - cx) ** 2 + (py - cy) ** 2);
    if (dist < outerR + 20 && dist > outerR - 30) {
      ctx.beginPath();
      ctx.arc(px, py, p.r * (1 + flow), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(47,210,255,${p.alpha * (0.3 + flow * 0.7)})`;
      ctx.fill();
    }
  }
  ctx.restore();

  /* Wheel body */
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(wheelAngle);

  for (let i = 0; i < N; i++) {
    const startAngle = i * SLICE - Math.PI / 2;
    const endAngle = startAngle + SLICE;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, outerR, startAngle, endAngle);
    ctx.closePath();

    const grad = ctx.createRadialGradient(0, 0, innerR, 0, 0, outerR);
    grad.addColorStop(0, WOOD_HIGHLIGHTS[i]);
    grad.addColorStop(0.5, WOOD_COLORS[i]);
    grad.addColorStop(1, WOOD_COLORS[i]);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    /* Wood grain lines */
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, outerR, startAngle, endAngle);
    ctx.closePath();
    ctx.clip();
    const midAngle = startAngle + SLICE / 2;
    for (let g = 0; g < 3; g++) {
      const frac = (g + 1) / 4;
      const a = startAngle + SLICE * frac;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * innerR, Math.sin(a) * innerR);
      ctx.lineTo(Math.cos(a) * outerR, Math.sin(a) * outerR);
      ctx.strokeStyle = 'rgba(0,0,0,0.08)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.restore();

    /* Highlight selected */
    if (i === highlightSlot && highlightAlpha > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, outerR, startAngle, endAngle);
      ctx.closePath();
      ctx.fillStyle = `rgba(255,215,0,${highlightAlpha * 0.4})`;
      ctx.fill();
      ctx.restore();
    }

    /* Paddles */
    const pa = startAngle + SLICE / 2;
    const px = Math.cos(pa) * paddleR;
    const py = Math.sin(pa) * paddleR;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(pa + Math.PI / 2);
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(-8, -3, 16, 6);
    ctx.strokeStyle = '#3a2510';
    ctx.lineWidth = 1;
    ctx.strokeRect(-8, -3, 16, 6);
    ctx.restore();

    /* Name text */
    ctx.save();
    ctx.rotate(midAngle);
    ctx.translate(outerR * 0.73, 0);
    ctx.rotate(Math.PI / 2);
    const name = NAMES[i];
    const fontSize = name.length > 18 ? w * 0.028 : name.length > 12 ? w * 0.034 : name.length > 6 ? w * 0.040 : w * 0.048;
    ctx.font = `800 ${fontSize}px 'Plus Jakarta Sans', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,0.95)';
    ctx.lineWidth = 3.5;
    ctx.lineJoin = 'round';
    const maxW = outerR * 0.55;
    ctx.strokeText(name, 0, 0, maxW);
    ctx.fillText(name, 0, 0, maxW);
    ctx.restore();
  }

  /* Iron outer ring — shinier */
  ctx.beginPath();
  ctx.arc(0, 0, outerR, 0, Math.PI * 2);
  ctx.strokeStyle = '#6a6a7a';
  ctx.lineWidth = 5;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, outerR + 3, 0, Math.PI * 2);
  ctx.strokeStyle = '#4a4a58';
  ctx.lineWidth = 2;
  ctx.stroke();

  /* Bolts */
  for (let i = 0; i < N; i++) {
    const a = i * SLICE;
    const bx = Math.cos(a) * (outerR + 1);
    const by = Math.sin(a) * (outerR + 1);
    ctx.beginPath();
    ctx.arc(bx, by, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = '#7a7a8a';
    ctx.fill();
    ctx.strokeStyle = '#4a4a58';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  /* Inner ring */
  ctx.beginPath();
  ctx.arc(0, 0, innerR, 0, Math.PI * 2);
  ctx.strokeStyle = '#6a6a7a';
  ctx.lineWidth = 4;
  ctx.stroke();

  /* Spokes */
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * innerR, Math.sin(a) * innerR);
    ctx.lineTo(Math.cos(a) * (outerR - 5), Math.sin(a) * (outerR - 5));
    ctx.strokeStyle = 'rgba(90,70,40,0.3)';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  /* Axle */
  const axleGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, innerR);
  axleGrad.addColorStop(0, '#999');
  axleGrad.addColorStop(0.3, '#777');
  axleGrad.addColorStop(0.7, '#666');
  axleGrad.addColorStop(1, '#555');
  ctx.beginPath();
  ctx.arc(0, 0, innerR - 2, 0, Math.PI * 2);
  ctx.fillStyle = axleGrad;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0, 0, 12, 0, Math.PI * 2);
  ctx.fillStyle = '#888';
  ctx.fill();
  ctx.strokeStyle = '#666';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-7, 0); ctx.lineTo(7, 0);
  ctx.moveTo(0, -7); ctx.lineTo(0, 7);
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.restore();

  /* Pointer (fixed, at top) — larger, brighter, pulsing */
  const ptrX = cx;
  const ptrY = cy - outerR - 10;
  ctx.save();
  const pulse = 0.7 + 0.3 * Math.sin(animTime * 3);
  ctx.shadowColor = `rgba(255,51,102,${pulse * 0.7})`;
  ctx.shadowBlur = 14 + pulse * 6;
  ctx.beginPath();
  ctx.moveTo(ptrX, ptrY + 34);
  ctx.lineTo(ptrX - 16, ptrY);
  ctx.lineTo(ptrX + 16, ptrY);
  ctx.closePath();
  const ptrGrad = ctx.createLinearGradient(ptrX - 16, ptrY, ptrX + 16, ptrY + 34);
  ptrGrad.addColorStop(0, '#ff4477');
  ptrGrad.addColorStop(1, '#cc0044');
  ctx.fillStyle = ptrGrad;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

/* ── DRAW VALVE (Plumber T-Wrench) ── */
function drawValve() {
  const w = valveCanvas.width;
  const h = valveCanvas.height;
  const cx = w / 2;
  const cy = h / 2;
  const ctx = valveCtx;
  const scale = Math.min(w, h) / 200;

  ctx.clearRect(0, 0, w, h);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(valveAngle);

  /* Yellow T-handle crossbar */
  const barW = 70 * scale, barH = 16 * scale;
  const barGrad = ctx.createLinearGradient(0, -70 * scale - barH, 0, -70 * scale);
  barGrad.addColorStop(0, '#ffe44d');
  barGrad.addColorStop(0.3, '#ffd700');
  barGrad.addColorStop(0.7, '#f0c000');
  barGrad.addColorStop(1, '#d4a800');
  ctx.beginPath();
  ctx.roundRect(-barW / 2, -70 * scale, barW, barH, 6 * scale);
  ctx.fillStyle = barGrad;
  ctx.fill();
  ctx.strokeStyle = '#b8960a';
  ctx.lineWidth = 1.5 * scale;
  ctx.stroke();

  /* Yellow grip texture */
  ctx.fillStyle = '#c8a200';
  for (let i = -3; i <= 3; i++) {
    ctx.beginPath();
    ctx.arc(i * 8 * scale, -62 * scale, 1.5 * scale, 0, Math.PI * 2);
    ctx.fill();
  }

  /* Dark metal stem */
  const stemW = 10 * scale;
  const stemTop = -58 * scale;
  const stemBot = 50 * scale;
  const stemGrad = ctx.createLinearGradient(-stemW / 2, 0, stemW / 2, 0);
  stemGrad.addColorStop(0, '#3a3a3a');
  stemGrad.addColorStop(0.3, '#6a6a6a');
  stemGrad.addColorStop(0.5, '#888');
  stemGrad.addColorStop(0.7, '#6a6a6a');
  stemGrad.addColorStop(1, '#3a3a3a');
  ctx.fillStyle = stemGrad;
  ctx.fillRect(-stemW / 2, stemTop, stemW, stemBot - stemTop);
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 0.8 * scale;
  ctx.strokeRect(-stemW / 2, stemTop, stemW, stemBot - stemTop);

  /* Ridged texture */
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 0.7 * scale;
  for (let y = stemTop + 4 * scale; y < stemBot - 4 * scale; y += 4 * scale) {
    ctx.beginPath();
    ctx.moveTo(-stemW / 2 + 1, y);
    ctx.lineTo(stemW / 2 - 1, y);
    ctx.stroke();
  }

  /* Fork tip */
  const forkY = stemBot;
  const forkSpread = 12 * scale;
  const forkLen = 16 * scale;
  const prongW = 4 * scale;

  ctx.fillStyle = stemGrad;
  ctx.fillRect(-forkSpread - prongW / 2, forkY, prongW, forkLen);
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 0.8 * scale;
  ctx.strokeRect(-forkSpread - prongW / 2, forkY, prongW, forkLen);
  ctx.fillRect(forkSpread - prongW / 2, forkY, prongW, forkLen);
  ctx.strokeRect(forkSpread - prongW / 2, forkY, prongW, forkLen);
  ctx.fillRect(-forkSpread - prongW / 2, forkY - 2 * scale, forkSpread * 2 + prongW, 4 * scale);

  ctx.restore();

  /* OPEN/CLOSE labels outside rotation */
  ctx.font = `600 ${9 * scale}px Plus Jakarta Sans, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(47,210,255,0.6)';
  ctx.fillText('↻ OPEN', cx + 40 * scale, cy);
  ctx.fillStyle = 'rgba(243,16,186,0.6)';
  ctx.fillText('↺ CLOSE', cx - 40 * scale, cy);
}

/* ── VALVE INTERACTION ── */
function getAngleFromCenter(canvas, clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left - rect.width / 2;
  const y = clientY - rect.top - rect.height / 2;
  return Math.atan2(y, x);
}

function handleValveStart(e) {
  if (gameState !== STATE.READY && gameState !== STATE.OPENING && gameState !== STATE.SPINNING) return;
  e.preventDefault();
  valveDragging = true;
  const touch = e.touches ? e.touches[0] : e;
  valveLastAngle = getAngleFromCenter(valveCanvas, touch.clientX, touch.clientY);
}

function handleValveMove(e) {
  if (!valveDragging) return;
  e.preventDefault();
  const touch = e.touches ? e.touches[0] : e;
  const currentAngle = getAngleFromCenter(valveCanvas, touch.clientX, touch.clientY);
  let delta = currentAngle - valveLastAngle;
  if (delta > Math.PI) delta -= Math.PI * 2;
  if (delta < -Math.PI) delta += Math.PI * 2;
  valveLastAngle = currentAngle;
  valveAngle += delta;
  applyValveDelta(delta);
}

function handleValveEnd() {
  valveDragging = false;
}

valveCanvas.addEventListener('mousedown', handleValveStart);
valveCanvas.addEventListener('touchstart', handleValveStart, { passive: false });
window.addEventListener('mousemove', handleValveMove);
window.addEventListener('touchmove', handleValveMove, { passive: false });
window.addEventListener('mouseup', handleValveEnd);
window.addEventListener('touchend', handleValveEnd);

function applyValveDelta(delta) {
  if (delta > 0.02) {
    openGate(delta * 8);
  } else if (delta < -0.02) {
    closeGate(-delta * 8);
  }
}

/* Button controls */
let cwInterval = null, ccwInterval = null;

function startCW() {
  if (gameState !== STATE.READY && gameState !== STATE.OPENING && gameState !== STATE.SPINNING) return;
  ensureAudio();
  openGate(0.12);
  valveAngle += 0.12;
  cwInterval = setInterval(() => {
    openGate(0.08);
    valveAngle += 0.1;
  }, 50);
}
function stopCW() { clearInterval(cwInterval); cwInterval = null; }

function startCCW() {
  if (gameState !== STATE.OPENING && gameState !== STATE.SPINNING) return;
  ensureAudio();
  closeGate(0.04);
  valveAngle -= 0.08;
  ccwInterval = setInterval(() => {
    closeGate(0.04);
    valveAngle -= 0.08;
  }, 50);
}
function stopCCW() { clearInterval(ccwInterval); ccwInterval = null; }

btnCW.addEventListener('mousedown', startCW);
btnCW.addEventListener('touchstart', (e) => { e.preventDefault(); startCW(); }, { passive: false });
btnCW.addEventListener('mouseup', stopCW);
btnCW.addEventListener('mouseleave', stopCW);
btnCW.addEventListener('touchend', stopCW);
btnCW.addEventListener('touchcancel', stopCW);

btnCCW.addEventListener('mousedown', startCCW);
btnCCW.addEventListener('touchstart', (e) => { e.preventDefault(); startCCW(); }, { passive: false });
btnCCW.addEventListener('mouseup', stopCCW);
btnCCW.addEventListener('mouseleave', stopCCW);
btnCCW.addEventListener('touchend', stopCCW);
btnCCW.addEventListener('touchcancel', stopCCW);

/* ── GATE CONTROL ── */
function openGate(amount) {
  ensureAudio();
  if (gameState === STATE.READY) {
    gameState = STATE.OPENING;
    selectedIndex = secureRandom(N);
    surgeTriggered = false;
    spinTimer = 0;
    startWaterNoise();
    sndValveOpen();
    announcerPhraseEl.textContent = 'Water flowing! The wheel is spinning...';
    setTimeout(announceSpinPhrase, 800);
  }
  gateOpenness = Math.min(1, gateOpenness + amount);
}

function closeGate(amount) {
  if (gameState !== STATE.OPENING && gameState !== STATE.SPINNING) return;
  gateOpenness = Math.max(0, gateOpenness - amount);
  if (gateOpenness <= 0 && gameState !== STATE.CLOSING && gameState !== STATE.LANDING) {
    gameState = STATE.CLOSING;
    sndValveClose();
    announcerPhraseEl.textContent = 'Gate closing… wheel slowing down…';
    computeTargetAngle();
  }
}

let closingStartAngle = 0;
let closingStartTime = 0;
const CLOSING_DURATION = 5;

function computeTargetAngle() {
  const slotCenter = selectedIndex * SLICE + SLICE / 2;
  const targetSlotAngle = (Math.PI * 2) - slotCenter;
  const extraRotations = 2;
  targetAngle = wheelAngle + extraRotations * Math.PI * 2;
  const currentNorm = ((targetAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  let diff = targetSlotAngle - currentNorm;
  if (diff < 0) diff += Math.PI * 2;
  targetAngle += diff;
  closingStartAngle = wheelAngle;
  closingStartTime = animTime;
}

/* ── PHYSICS UPDATE ── */
let lastFrameTime = 0;
let tickAccum = 0;
let lastTickSlot = -1;
let phraseTimer = 0;

function update(dt) {
  if (dt > 0.1) dt = 0.1;
  animTime += dt;

  switch (gameState) {
    case STATE.OPENING:
    case STATE.SPINNING: {
      pressure = Math.min(1, pressure + gateOpenness * dt * 2);
      const maxSpeed = 4 + pressure * 6;
      wheelSpeed += gateOpenness * dt * 8;
      if (wheelSpeed > maxSpeed) wheelSpeed = maxSpeed;
      wheelAngle += wheelSpeed * dt;
      spinTimer += dt;

      if (gameState === STATE.OPENING && wheelSpeed > 2) {
        gameState = STATE.SPINNING;
      }

      if (gameState === STATE.SPINNING && spinTimer > 3.5 && gateOpenness > 0) {
        gateOpenness = Math.max(0, gateOpenness - dt * 0.8);
        if (gateOpenness <= 0) {
          gameState = STATE.CLOSING;
          sndValveClose();
          announcerPhraseEl.textContent = 'Gate closing… wheel slowing down…';
          computeTargetAngle();
        }
      }

      if (!surgeTriggered && spinTimer > 1.5 && spinTimer < 2.5 && Math.random() < 0.002) {
        if (secureRandom(10) === 0) {
          surgeTriggered = true;
          surgeOverlay.classList.add('visible');
          sndSurge();
          announceSurge();
          setTimeout(() => surgeOverlay.classList.remove('visible'), 1200);
        }
      }

      phraseTimer += dt;
      if (phraseTimer > 4 && gameState === STATE.SPINNING) {
        phraseTimer = 0;
        if (Math.random() < 0.6) announceSpinPhrase();
      }

      tickAccum += wheelSpeed * dt;
      const currentSlot = Math.floor(((wheelAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) / SLICE);
      if (currentSlot !== lastTickSlot) {
        lastTickSlot = currentSlot;
        if (wheelSpeed > 0.5) sndGearTick();
      }

      setWaterLevel(pressure);
      break;
    }

    case STATE.CLOSING:
    case STATE.LANDING: {
      pressure = Math.max(0, pressure - dt * 1.2);
      const elapsed = animTime - closingStartTime;
      const totalDist = targetAngle - closingStartAngle;
      const t = Math.min(elapsed / CLOSING_DURATION, 1);
      const eased = 1 - Math.pow(1 - t, 3);
      const newAngle = closingStartAngle + totalDist * eased;
      wheelSpeed = Math.max(0, (newAngle - wheelAngle) / Math.max(dt, 0.001));
      wheelAngle = newAngle;

      if (t > 0.7 && gameState === STATE.CLOSING) {
        gameState = STATE.LANDING;
        sndDecelWhoosh();
      }

      if (t >= 1) {
        wheelAngle = targetAngle;
        wheelSpeed = 0;
        gameState = STATE.LANDED;
        setWaterLevel(0);
        stopWaterNoise();
        onLanded();
      }

      const currentSlotC = Math.floor(((wheelAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) / SLICE);
      if (currentSlotC !== lastTickSlot) {
        lastTickSlot = currentSlotC;
        if (wheelSpeed > 0.3) sndGearTick();
      }

      setWaterLevel(pressure);
      break;
    }

    default:
      break;
  }

  if (gameState === STATE.LANDED || gameState === STATE.REPLAY) {
    highlightSlot = selectedIndex;
    highlightAlpha = Math.min(1, highlightAlpha + dt * 3);
  } else {
    highlightAlpha = Math.max(0, highlightAlpha - dt * 3);
    if (highlightAlpha <= 0) highlightSlot = -1;
  }

  gateFill.style.width = (gateOpenness * 100) + '%';
  gateStatus.textContent = gateOpenness <= 0 ? 'CLOSED' : gateOpenness >= 1 ? 'FULL OPEN' : Math.round(gateOpenness * 100) + '%';
  pressureFill.style.width = (pressure * 100) + '%';
}

/* ── LANDING EFFECTS ── */
const EFFECTS = ['gold', 'blue', 'red', 'magenta', 'shake', 'confetti'];

function onLanded() {
  spinCount++;
  const winner = NAMES[selectedIndex];

  history.unshift({ num: spinCount, name: winner });
  if (history.length > 10) history.pop();
  saveHistory();
  renderHistory();

  setTimeout(() => {
    sndGameShowLose();

    let effectIdx;
    do { effectIdx = Math.floor(Math.random() * EFFECTS.length); } while (effectIdx === lastEffectIdx && EFFECTS.length > 1);
    lastEffectIdx = effectIdx;
    const effect = EFFECTS[effectIdx];

    if (effect === 'shake') {
      document.body.classList.add('shake');
      setTimeout(() => document.body.classList.remove('shake'), 400);
      sndMetalClank();
    } else if (effect === 'confetti') {
      spawnConfetti();
    } else {
      landingFlash.className = 'landing-flash ' + effect + ' visible';
      setTimeout(() => landingFlash.classList.remove('visible'), 600);
    }

    sndWaterSplash();

    setTimeout(() => {
      announce(`THE WHEEL HAS CHOSEN: ${winner.toUpperCase()}!`, 2);
      sndFanfare();

      setTimeout(() => {
        showPrize(winner);
        replayBtn.classList.add('visible');
        gameState = STATE.REPLAY;
      }, 1800);
    }, 600);
  }, 500);
}

function spawnConfetti() {
  const colors = ['#2fd2ff', '#f310ba', '#ffd700', '#3d3dea', '#ff9df2', '#ff3366'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
    piece.style.animationDelay = (Math.random() * 0.5) + 's';
    piece.style.width = (Math.random() * 6 + 4) + 'px';
    piece.style.height = (Math.random() * 8 + 6) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    confettiContainer.appendChild(piece);
    setTimeout(() => piece.remove(), 4000);
  }
}

function showPrize(winner) {
  prizeWinnerName.textContent = winner;
  prizeOverlay.classList.add('visible');
}

prizeClose.addEventListener('click', () => {
  prizeOverlay.classList.remove('visible');
});

/* ── REPLAY ── */
replayBtn.addEventListener('click', () => {
  gameState = STATE.READY;
  gateOpenness = 0;
  pressure = 0;
  wheelSpeed = 0;
  selectedIndex = -1;
  highlightSlot = -1;
  highlightAlpha = 0;
  surgeTriggered = false;
  spinTimer = 0;
  phraseTimer = 0;
  lastTickSlot = -1;
  tickAccum = 0;
  replayBtn.classList.remove('visible');
  prizeOverlay.classList.remove('visible');
  stopWaterNoise();
  announcerPhraseEl.textContent = 'Drag the T-valve ↻ to release the water!';
  announcerNameEl.textContent = ' ';
  announcerEl.classList.remove('active');
  btnCW.disabled = false;
  btnCCW.disabled = false;
});

/* ── AUDIO CONTROLS ── */
muteBtn.addEventListener('click', () => {
  ensureAudio();
  toggleMute();
});

/* ── CANVAS RESIZE ── */
function resizeCanvases() {
  const area = document.getElementById('wheelArea');
  const size = Math.min(area.clientWidth, area.clientHeight, 700);
  wheelCanvas.style.width = size + 'px';
  wheelCanvas.style.height = size + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  wheelCanvas.width = size * dpr;
  wheelCanvas.height = size * dpr;
  wheelCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

resizeCanvases();
window.addEventListener('resize', resizeCanvases);

/* ── MAIN LOOP ── */
function gameLoop(timestamp) {
  if (!lastFrameTime) lastFrameTime = timestamp;
  const dt = (timestamp - lastFrameTime) / 1000;
  lastFrameTime = timestamp;

  update(dt);
  drawWheel();
  drawValve();

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

wheelCanvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

btnCW.disabled = false;
btnCCW.disabled = false;

})();
</script>
